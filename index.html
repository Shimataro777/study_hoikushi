<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暗記ノート｜保育士試験</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="暗記ノート">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f6f6f3; --surface:#ffffff; --surface2:#efefeb; --ink:#1c1c1e; --ink2:#3d3d41; --muted:#77777d; --line:#e2e2dd;
  --primary:#1c1c1e; --on-primary:#ffffff;
  --b-new:#bdbdb6; --b-wrong:#c4553f; --b-unsure:#c0972f; --b-correct:#3e8767; --b-unknown:#6f7fb3;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111112; --surface:#1a1a1c; --surface2:#252528; --ink:#f1f1f2; --ink2:#d2d2d6; --muted:#9a9aa1; --line:#2e2e32;
    --primary:#f1f1f2; --on-primary:#111112;
    --b-new:#5c5c62; --b-wrong:#e07b64; --b-unsure:#d9b257; --b-correct:#63b38e; --b-unknown:#97a6dc;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 振り分けの色（ここだけ有彩色） */
.b-new{--c:var(--b-new)} .b-unknown{--c:var(--b-unknown)} .b-wrong{--c:var(--b-wrong)} .b-unsure{--c:var(--b-unsure)} .b-correct{--c:var(--b-correct)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}

/* ---------- 上部バー ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top-in{max-width:600px;margin:0 auto;height:56px;padding:0 12px;display:flex;align-items:center;gap:10px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface2)}
.top .ttl{font-weight:600}
.rprog{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.rprog i{display:block;height:100%;background:var(--ink);transition:width .3s}
.rnum{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:48px;text-align:right}

main{max-width:600px;margin:0 auto;padding:28px 18px calc(110px + env(safe-area-inset-bottom,0px))}
.flow main,main.flow{padding-bottom:40px}

/* ---------- 見出し・文字 ---------- */
.ptitle{font-size:30px;line-height:1.25;font-weight:700;letter-spacing:-.01em;margin:0}
.psub{color:var(--muted);font-size:14px;margin:4px 0 0}
.lead{color:var(--ink2);font-size:15px;margin:16px 0 0}
.sect{margin-top:32px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.stitle{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px;letter-spacing:.02em}
.shead .stitle{margin:0}
.hint{font-size:13px;color:var(--muted);margin:2px 0 10px}
.muted{color:var(--muted)}
.textbtn{border:0;background:none;padding:6px 0;font-size:14px;color:var(--ink2);display:inline-flex;align-items:center;gap:4px}
.textbtn .i{width:16px;height:16px}
.textbtn.danger{color:var(--b-wrong)}

/* ---------- メニュー ---------- */
.menu,.panel,.checklist,.rows{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mrow{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:0;background:none;text-align:left}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow:hover{background:var(--surface2)}
.mi{width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none}
.mtx{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}
.mt{font-weight:600;font-size:16px}
.ms{font-size:13px;color:var(--muted)}
.mrow .mchev{color:var(--muted);width:18px;height:18px}
.mrow.accent .mi{background:color-mix(in srgb,var(--b-wrong) 12%,var(--surface));color:var(--b-wrong)}

/* ---------- 振り分け状況 ---------- */
.panel{padding:18px}
.ov+.ov{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.ovh{display:flex;justify-content:space-between;font-weight:600;font-size:15px;margin-bottom:10px}
.ovh .muted{font-weight:400;font-size:13px}
.sbar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;background:var(--surface2)}
.sbar i{display:block;background:var(--c);min-width:3px}
.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px}
.lg{display:flex;flex-direction:column;gap:2px}
.lg .ll{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.lg b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- ボタン ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:16px;transition:opacity .15s,transform .1s}
.btn:active:not(:disabled){transform:scale(.985)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.block{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btns{display:grid;gap:10px}
.actionbar{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));margin-top:24px;z-index:5;padding-top:14px;background:linear-gradient(to bottom,transparent,var(--bg) 40%)}
.actionbar.static{position:static;background:none;padding-top:0}
.actionbar.tabbed{bottom:calc(76px + env(safe-area-inset-bottom,0px))}

/* ---------- セグメント・チップ ---------- */
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.chip .n{opacity:.55;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

/* ---------- 出題設定 ---------- */
.fgroup{margin-top:22px}
.check{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;background:none;text-align:left;font-size:16px}
.check+.check{border-top:1px solid var(--line)}
.check .box{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;flex:none;transition:background .15s}
.check .box .i{width:15px;height:15px;stroke-width:2.6}
.check[aria-checked="true"] .box{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.check .cn{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.quick{display:flex;gap:16px;margin-top:8px}
.summary-line{font-size:14px;color:var(--muted);text-align:center;margin:0 0 10px}

/* ---------- 問題 ---------- */
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 10px}
.prev{display:inline-flex;align-items:center;gap:6px}
.qtext{font-size:20px;line-height:1.7;font-weight:600;margin:0 0 22px;letter-spacing:.01em}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;font-size:16px;transition:border-color .15s,background .15s,opacity .15s}
.choice:hover:not(:disabled){border-color:var(--ink2)}
.choice:disabled{cursor:default}
.choice .key{width:20px;font-size:13px;font-weight:600;color:var(--muted);flex:none}
.choice .ctext{flex:1}
.choice .cmark{width:20px;height:20px;flex:none}
.choice.is-ok{border-color:var(--b-correct);background:color-mix(in srgb,var(--b-correct) 9%,var(--surface));color:var(--ink)}
.choice.is-ok .cmark{color:var(--b-correct)}
.choice.is-ng{border-color:var(--b-wrong);background:color-mix(in srgb,var(--b-wrong) 9%,var(--surface))}
.choice.is-ng .cmark{color:var(--b-wrong)}
.choice.is-dim{opacity:.4}
.toggle{display:inline-flex;align-items:center;gap:12px;margin-top:18px;font-size:15px;color:var(--ink2);cursor:pointer;user-select:none;position:relative}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .sw{width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;flex:none}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s}
.toggle input:checked + .sw{background:var(--b-unsure)}
.toggle input:checked + .sw::after{transform:translateX(16px)}
.toggle input:focus-visible + .sw{outline:2px solid var(--ink);outline-offset:2px}

.verdict{display:flex;align-items:center;gap:12px;margin-top:24px;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--c) 10%,var(--surface));animation:in .25s ease-out}
.verdict .vi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none}
.verdict .vi .i{stroke-width:2.6;width:18px;height:18px}
.verdict b{display:block;font-size:17px;line-height:1.3}
.verdict span.vs{font-size:13px;color:var(--muted)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.answer{margin:18px 0 0;font-size:17px;font-weight:600;display:flex;align-items:baseline;gap:10px}
.answer span{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.block{margin-top:22px}
.block h3,.block > summary{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px;letter-spacing:.02em}
.prose{white-space:pre-wrap;margin:0;line-height:1.85}
.note{background:var(--surface2);border-radius:12px;padding:14px 16px}
details.block > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
details.block > summary::-webkit-details-marker{display:none}
details.block > summary .i{width:16px;height:16px;transition:transform .2s}
details.block[open] > summary .i{transform:rotate(180deg)}
.clist{border-top:1px solid var(--line)}
.citem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.citem .ic{width:18px;height:18px;flex:none;margin-top:3px;color:var(--muted)}
.citem.ok .ic{color:var(--b-correct)} .citem.picked .ic{color:var(--b-wrong)}
.citem .ic .i{width:18px;height:18px;stroke-width:2.4}
.citem .ct{flex:1;min-width:0}
.citem .cn{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.citem .cn small{font-size:12px;font-weight:400;color:var(--muted)}
.citem .cs{margin:2px 0 0;font-size:14px;line-height:1.7;color:var(--ink2)}
.citem .textbtn{font-size:13px;padding:2px 0;color:var(--muted)}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px}
.tchip:hover{border-color:var(--ink2)}

.seg3{display:flex;gap:6px;flex-wrap:wrap}
.seg3 button{flex:1 1 0;min-width:0;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg3 button[aria-checked="true"]{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.seg3.sm{gap:4px}
.seg3.sm button{padding:7px 2px;font-size:12.5px;gap:4px}

/* ---------- 並べ替え ---------- */
.axis{font-size:12px;color:var(--muted);margin:6px 2px}
.slist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sitem{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;user-select:none;transition:border-color .15s,background .15s}
.sitem.sel{border-color:var(--ink);background:var(--surface2)}
.sitem .no{width:20px;font-size:13px;font-weight:600;color:var(--muted);flex:none;display:grid;place-items:center}
.sitem .st{flex:1;min-width:0;line-height:1.5}
.sitem .yr{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sitem .mv{display:flex;gap:4px}
.sitem .mv button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.sitem .mv button:disabled{opacity:.3;cursor:default}
.sitem.ok{border-color:var(--b-correct);cursor:default} .sitem.ok .no{color:var(--b-correct)}
.sitem.ng{border-color:var(--b-wrong);cursor:default} .sitem.ng .no{color:var(--b-wrong)}
.sitem .no .i{width:16px;height:16px;stroke-width:2.6}
.tl{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tl li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.tl .y{font-weight:600;font-variant-numeric:tabular-nums;line-height:1.4}
.tl .y small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.tl .t{font-weight:600;margin:0 0 4px}
.tl .x{margin:0 0 10px;font-size:14px;color:var(--ink2);line-height:1.8}

/* ---------- 結果 ---------- */
.score{font-size:15px;color:var(--muted);margin:10px 0 0}
.score b{font-size:44px;font-weight:600;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-right:4px}
.legend.three{grid-template-columns:repeat(3,1fr)}

/* ---------- 一覧 ---------- */
.rows{list-style:none;margin:0;padding:0}
.row+.row{border-top:1px solid var(--line)}
.row-h{display:flex;align-items:flex-start;gap:12px;width:100%;padding:14px 16px;border:0;background:none;text-align:left}
.row-h:hover{background:var(--surface2)}
.row-h .dot{margin-top:9px}
.row-t{flex:1;min-width:0;font-size:15px;line-height:1.6}
.row.open .row-t{display:block}
.row-b{font-size:12px;color:var(--muted);white-space:nowrap;margin-top:3px}
.row-h .i{width:16px;height:16px;color:var(--muted);margin-top:4px;transition:transform .2s}
.row.open .row-h .i{transform:rotate(180deg)}
.row-d{padding:0 16px 18px 36px}
@media (max-width:420px){.row-d{padding-left:16px}}
.row-d .answer{margin:0 0 8px}
.row-d .prose{font-size:14px;color:var(--ink2);margin-bottom:14px}
.row-d .textbtn{margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:14px}
.warn{margin-top:28px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.warn summary{cursor:pointer}
.warn ul{margin:6px 0 0;padding-left:18px}
.foot{margin-top:28px;text-align:center}

/* ---------- 図鑑 ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-top:14px}
.search:focus-within{border-color:var(--ink2)}
.search .i{color:var(--muted);width:18px;height:18px}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:16px;outline:none}
.drow{display:block;width:100%;text-align:left;border:0;background:none;padding:14px 16px}
.drow:hover{background:var(--surface2)}
.drow .dh{display:flex;align-items:center;gap:8px}
.drow .dn{font-weight:600}
.drow .dk{font-size:12px;color:var(--muted)}
.drow .ds{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.6}

/* ---------- タブバー ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
.tab .i{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}

/* ---------- モーダル・トースト ---------- */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.35);animation:fade .2s}
.msheet{position:relative;width:100%;max-width:600px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 20px calc(28px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@media (min-width:700px){.modal{align-items:center}.msheet{border-radius:20px}}
.mclose{position:sticky;top:0;float:right;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center;z-index:1}
.mclose .i{width:16px;height:16px}
.msheet h2{font-size:24px;margin:4px 0 0;font-weight:700;line-height:1.3}
.msheet .kana{color:var(--muted);font-size:13px;margin:2px 0 0}
.msheet .lead{font-weight:500;color:var(--ink);background:var(--surface2);border-radius:12px;padding:14px 16px;margin:16px 0 0}
.rel{border-top:1px solid var(--line)}
.rel div{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6}
.rel .dot{margin-top:8px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;padding:10px 18px;border-radius:999px;width:max-content;max-width:calc(100vw - 32px);text-align:center;pointer-events:none;animation:toast 2s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}10%{opacity:1;transform:translate(-50%,0)}85%{opacity:1}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- 単元 ---------- */
.mrow .mbar{margin-top:8px}
.mrow .mbar .sbar{height:5px}
.urow .mtx{gap:1px}
.brandrow{display:flex;align-items:center;gap:14px}
.applogo{width:44px;height:44px;border-radius:11px;flex:none}
.uicon{width:48px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:14px}
.uicon .i{width:24px;height:24px}
.row-u{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.ulabel{font-size:12px;color:var(--muted)}
.other{background:var(--surface2);border-radius:12px;padding:12px 14px;margin-top:8px;display:block;width:100%;text-align:left;border:0}

.fld{margin-top:16px}
.fld > label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.fld > label.req::after{content:"必須";font-size:11px;font-weight:600;margin-left:8px;color:var(--b-wrong)}
.inp,.ta,.sel{display:block;width:100%;font-size:16px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-family:inherit}

<script>
(function(){
'use strict';

/* =========================================================
 * ユーティリティ・アイコン
 * ========================================================= */
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uniq = arr => [...new Set(arr)];
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const qList = q => Array.isArray(q) ? q.filter(Boolean) : (q ? [q] : []);
const KEYS = ['A', 'B', 'C', 'D'];
const ICONS = {
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>',
  book: '<path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/>',
  data: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  list: '<path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  hourglass: '<path d="M5 22h14M5 2h14M17 22v-4.2a2 2 0 0 0-.6-1.4L12 12l-4.4 4.4a2 2 0 0 0-.6 1.4V22M7 2v4.2a2 2 0 0 0 .6 1.4L12 12l4.4-4.4a2 2 0 0 0 .6-1.4V2"/>',
  retry: '<path d="M3 12a9 9 0 1 0 9-9 9.8 9.8 0 0 0-6.7 2.7L3 8"/><path d="M3 3v5h5"/>',
  layers: '<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  chevL: '<path d="m15 18-6-6 6-6"/>',
  chevD: '<path d="m6 9 6 6 6-6"/>',
  up: '<path d="m18 15-6-6-6 6"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  note: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  vol: '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>',
  mute: '<path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6M16 9l6 6"/>',
  play: '<path d="M7 4.5v15a.8.8 0 0 0 1.2.7l12-7.5a.8.8 0 0 0 0-1.4l-12-7.5A.8.8 0 0 0 7 4.5z"/>',
  question: '<circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
  ruby: '<path d="M4 20h7M7.5 20V9M3 9h9M14 4h7M17.5 4v6"/><path d="M14 14h7M14 18h7"/>',
  paste: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  cap: '<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/><path d="M22 10v6"/>',
  blocks: '<rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/><rect x="8" y="3" width="8" height="8" rx="1.5"/>',
  sprout: '<path d="M7 20h10M12 20v-8"/><path d="M12 12c-3.5 0-6-2-6-6 3.5 0 6 2 6 6zM12 12c0-3.5 2.5-6 6-6 0 4-2.5 6-6 6z"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'
};
const I = (name, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.book}</svg>`;
document.querySelectorAll('[data-icon]').forEach(el => { el.outerHTML = I(el.dataset.icon); });
function toast(text){
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = text; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2100);
}

/* =========================================================
 * 説明（？ボタンで表示）
 * ========================================================= */
const HELP = {
  home: ['使い方', '単元を選んで学習します。解いた問題は「正解・自信なし・不正解」に自動で振り分けられ、あとから好きな組み合わせで何度でも解き直せます。\n\n問題の文章は解答後の「編集・メモ」から直せます。問題の追加やバックアップは「データ」タブで行います。'],
  buckets: ['出題する問題', '出題したい振り分けを選びます。複数選ぶと組み合わせて出題します。\n\n「苦手だけ」は、不正解・わからない・自信なしをまとめて選びます。'],
  classify: ['振り分け', '解答の結果から自動で振り分けています。変えたいときはタップしてください。\n\n「自信がない」をオンにして正解すると「自信なし」、「わからない」を選ぶと「わからない」になります。'],
  resume: ['中断と再開', '問題の途中で × を押すと中断できます。それまでの振り分けは保存され、学習画面の「続きから再開」から再開できます。\n\n中断中に別の問題を始めると、中断していた分は破棄されます。'],
  ruby: ['ふりがなの辞書', '1行に1語ずつ「語=よみ」の形で書きます。\n例：恩物=おんぶつ\n\n最初から入っている読みを消したいときは「語=」と読みを空にします。'],
  sort: ['年号並べ替え', '上が古くなるように並べます。矢印で1つずつ動かすか、2つの出来事を続けてタップすると入れ替わります。\n\nわからないときは「わからない」で正しい順序と解説を確認できます。'],
  list: ['振り分け', '振り分けごとに問題を確認できます。項目をタップすると、解説とメモの確認、振り分けの変更、問題の編集ができます。'],
  dict: ['図鑑', 'すべての用語・人物と年表を確認できます。用語をタップすると、くわしい説明や、他の単元での説明が表示されます。'],
  data: ['データ', '編集・メモ・追加した問題・学習記録は、この端末のブラウザに保存されます。機種変更や念のための保存に「バックアップを書き出す」を使ってください。'],
  bulk: ['まとめて追加の手順', '1. 「AIへの指示をコピー」を押す\n2. ChatGPTなどのAIに貼り付け、【テーマ】と【作る数】を書き換えて送る\n3. AIの出力をそのまま下の欄に貼り付ける（テキストファイルの読み込みも可）\n4. 読み取り結果を確認して「追加する」を押す\n\n「用語」と「要約」があれば図鑑に、「問題」があれば4択問題にもなります。「年」と「出来事」を書いた項目は年号並べ替えに使われます。'],
  one: ['1件ずつ追加', '「答え」と「要約」は必須です。「問題文」を書くと4択問題になります。誤りの選択肢は、同じ単元・同じ分野の用語から自動で選ばれます。']
};
const help = key => `<button class="help" data-act="help" data-v="${key}" aria-label="説明を見る">?</button>`;

/* =========================================================
 * 保存（学習記録 P と、ユーザーの編集・追加 U）
 * ========================================================= */
const PKEY = 'hoikushi-anki-v2', UKEY = 'hoikushi-anki-user-v1';
const blankP = () => ({ q: {}, e: {}, best: 0 });
const blankU = () => ({ units: [], terms: [], events: [], edits: {}, memos: {} });
const loadJSON = (k, f) => { try { const o = JSON.parse(localStorage.getItem(k) || 'null'); return o ? { ...f(), ...o } : f(); } catch (_) { return f(); } };
let P = loadJSON(PKEY, blankP), U = loadJSON(UKEY, blankU);
const SETKEY = 'hoikushi-anki-settings-v1', SKEY = 'hoikushi-anki-session-v1';
let SET = loadJSON(SETKEY, () => ({ sound: true, ruby: true }));
const saveSet = () => { try { localStorage.setItem(SETKEY, JSON.stringify(SET)); } catch (_) {} };

/* ---------- 効果音（Web Audioで合成。音声ファイル不要） ---------- */
const SFX = (() => {
  let ac = null;
  const ctx = () => {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  };
  function tone(freq, at, dur, type = 'sine', vol = 0.16){
    const c = ctx(); if (!c) return;
    const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  }
  const play = fn => { if (SET.sound) { try { fn(); } catch (_) {} } };
  return {
    unlock: () => { if (SET.sound) ctx(); },
    correct: () => play(() => { tone(880, 0, 0.16); tone(1318.5, 0.09, 0.32); tone(2637, 0.09, 0.2, 'sine', 0.03); }),
    streak: n => play(() => { [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone(f, i * 0.07, 0.22, 'sine', 0.12)); if (n >= 10) tone(2637, 0.3, 0.4, 'sine', 0.06); }),
    wrong: () => play(() => { tone(392, 0, 0.16, 'triangle', 0.13); tone(311, 0.13, 0.3, 'triangle', 0.11); }),
    unknown: () => play(() => { tone(659, 0, 0.14, 'sine', 0.09); tone(784, 0.1, 0.24, 'sine', 0.08); }),
    finish: rate => play(() => {
      const notes = rate >= 80 ? [523.25, 659.25, 784, 1046.5, 1318.5] : rate >= 50 ? [523.25, 659.25, 784, 1046.5] : [523.25, 659.25, 784];
      notes.forEach((f, i) => tone(f, i * 0.1, i === notes.length - 1 ? 0.6 : 0.2, 'sine', 0.12));
      if (rate >= 80) { tone(659.25, 0.4, 0.6, 'sine', 0.06); tone(784, 0.4, 0.6, 'sine', 0.06); }
    })
  };
})();

/* ---------- 中断・再開 ---------- */
function saveSession(){
  const r = state.round; if (!r) return;
  const c = r.cur, answered = c && (c.type === 'quiz' ? c.picked !== null : c.done);
  try { localStorage.setItem(SKEY, JSON.stringify({ items: r.items, i: r.i, results: r.results, origin: r.origin, answered: answered ? { ok: c.ok } : null, t: Date.now() })); } catch (_) {}
}
function loadSession(){
  try {
    const s = JSON.parse(localStorage.getItem(SKEY) || 'null');
    if (!s || !Array.isArray(s.items)) return null;
    const done = s.i + (s.answered ? 1 : 0);
    if (done >= s.items.length) return null;
    return { ...s, done, left: s.items.length - done };
  } catch (_) { return null; }
}
const clearSession = () => { try { localStorage.removeItem(SKEY); } catch (_) {} };
function sessionLabel(s){
  const kinds = uniq(s.items.map(x => x.type));
  return `${unitName(s.origin.unit)}・${kinds.length > 1 ? '復習' : kinds[0] === 'sort' ? '年号並べ替え' : '4択'}`;
}
function resumeCard(){
  const s = loadSession();
  if (!s) return '';
  return `<section class="sect"><div class="shead"><h2 class="stitle">中断中 ${help('resume')}</h2><button class="textbtn" data-act="discardSession">破棄</button></div>
    <div class="menu"><button class="mrow resume" data-act="resume"><span class="mi">${I('play')}</span><span class="mtx"><span class="mt">続きから再開</span><span class="ms">${esc(sessionLabel(s))}　あと${s.left}${s.items.every(x => x.type === 'sort') ? 'セット' : '問'}（${s.done}/${s.items.length}）</span></span>${I('chev', 'mchev')}</button></div></section>`;
}
function resumeSession(){
  const s = loadSession(); if (!s) return;
  const r = { items: s.items, i: s.i, results: s.results || [], origin: s.origin, cur: null };
  if (s.answered) { r.results.push({ item: r.items[r.i], ok: s.answered.ok }); r.i++; }
  state.round = r;
  go({ v: 'round' });
}
const saveP = () => { try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (_) { toast('保存できませんでした'); } };
const saveU = () => { try { localStorage.setItem(UKEY, JSON.stringify(U)); } catch (_) { toast('保存できませんでした'); } };

/* =========================================================
 * データの組み立て（ファイルのデータ＋ユーザーの編集・追加）
 * ========================================================= */
let UNITS, unitById, TERMS, QUESTIONS, EVENTS, termByKey, termByName, qById, eById, WARNINGS;
const yearLabel = e => `${e.year}年${e.era ? `（${e.era}）` : ''}`;
const unitName = id => id === 'all' ? 'すべての単元' : (unitById.get(id)?.name || id);
const termIn = (unit, name) => termByName.get(unit + '::' + name);
function buildData(){
  const base = (window.UNITS || []).map(u => ({ ...u, builtin: true }));
  const users = (U.units || []).map(u => ({ order: 100, icon: 'book', yearQuiz: true, ...u, builtin: false }));
  UNITS = [...base, ...users].sort((a, b) => (a.order || 0) - (b.order || 0));
  unitById = new Map(UNITS.map(u => [u.id, u]));
  TERMS = []; QUESTIONS = []; EVENTS = [];
  const addTerm = (unit, raw, key, qBase, user) => {
    const ed = U.edits['t:' + key];
    const t = { ...raw, ...(ed || {}), unit, key, user, edited: !!ed };
    TERMS.push(t);
    qList(t.q).forEach((text, n) => QUESTIONS.push({
      id: `${qBase}:${n}`, unit, cat: t.cat, type: 'term', question: text, answer: t.term, termKey: key,
      exclude: t.exclude || [], explanation: [t.summary, t.detail].filter(Boolean).join('\n'), point: t.point
    }));
  };
  for (const u of base) for (const t of (u.terms || [])) addTerm(u.id, t, u.id + '::' + t.term, `${u.id}:${t.term}`, false);
  for (const t of U.terms) if (unitById.has(t.unit)) addTerm(t.unit, t, t.unit + '::@' + t.id, `${t.unit}:@${t.id}`, true);
  const addEvent = (unit, e, user) => { const ed = U.edits['e:' + e.id]; EVENTS.push({ ...e, ...(ed || {}), unit, user, edited: !!ed }); };
  for (const u of base) for (const e of (u.events || [])) addEvent(u.id, e, false);
  for (const e of U.events) if (unitById.has(e.unit)) addEvent(e.unit, e, true);
  for (const e of EVENTS) {
    if (!unitById.get(e.unit).yearQuiz) continue;
    QUESTIONS.push({ id: `${e.unit}:y:${e.id}`, unit: e.unit, cat: '年号', type: 'year', eventId: e.id,
      question: `${e.title}は何年？`, answer: yearLabel(e), exclude: [], explanation: e.explanation || '', point: e.point });
  }
  termByKey = new Map(TERMS.map(t => [t.key, t]));
  termByName = new Map(TERMS.map(t => [t.unit + '::' + t.term, t]));
  qById = new Map(QUESTIONS.map(q => [q.id, q]));
  eById = new Map(EVENTS.map(e => [e.id, e]));
  WARNINGS = validate();
  buildRuby();
}
function validate(){
  const w = [], seenT = new Set();
  for (const t of TERMS) { const k = t.unit + '::' + t.term; if (seenT.has(k)) w.push(`${unitName(t.unit)}：用語「${t.term}」が重複しています`); seenT.add(k); }
  for (const q of QUESTIONS) {
    const n = distractorsFor(q).length;
    if (n < 3) w.push(`${unitName(q.unit)}：「${q.answer}」の問題は、誤りの選択肢の候補が${n}個しかありません（同じ単元に用語を増やすと4択になります）`);
  }
  return w;
}
let RUBY_MAP = {}, RUBY_RE = null;
function buildRuby(){
  const m = { ...(window.RUBY || {}) };
  for (const t of TERMS) if (t.kana && /[\u4e00-\u9fff々]/.test(t.term) && !/[ぁ-んァ-ヶー・]/.test(t.term) && !/・/.test(t.kana)) m[t.term] = t.kana.replace(/\s+/g, '');
  for (const [k, v] of Object.entries(U.ruby || {})) { if (v) m[k] = v; else delete m[k]; }
  RUBY_MAP = m;
  const keys = Object.keys(m).filter(k => /[\u4e00-\u9fff々]/.test(k)).sort((a, b) => b.length - a.length);
  RUBY_RE = keys.length ? new RegExp(keys.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g') : null;
}
const rb = s => { const e = esc(s); return SET.ruby && RUBY_RE ? e.replace(RUBY_RE, w => `<ruby>${w}<rt>${RUBY_MAP[w]}</rt></ruby>`) : e; };
const memoKey = q => q.type === 'term' ? 'k:' + q.termKey : 'e:' + q.eventId;
const memoOf = q => U.memos[memoKey(q)] || '';
const memoOfEvent = e => U.memos['e:' + e.id] || '';

/* =========================================================
 * 振り分け
 * ========================================================= */
const ORDER = ['new', 'unknown', 'wrong', 'unsure', 'correct'];
const BL = { new: '未回答', unknown: 'わからない', wrong: '不正解', unsure: '自信なし', correct: '正解' };
const WEAK = ['unknown', 'wrong', 'unsure'];
const isWeak = b => WEAK.includes(b);
const bucket = (k, id) => (P[k][id] && P[k][id].b) || 'new';
function setBucket(k, id, b){ const r = P[k][id] || { n: 0, ok: 0 }; r.b = b; P[k][id] = r; saveP(); }
function recordAnswer(k, id, ok, unsure, unknown){
  const r = P[k][id] || { n: 0, ok: 0 };
  r.n++; if (ok) r.ok++;
  r.b = unknown ? 'unknown' : ok ? (unsure ? 'unsure' : 'correct') : 'wrong'; r.t = Date.now(); P[k][id] = r;
}
function countB(k, list){ const c = { new: 0, unknown: 0, wrong: 0, unsure: 0, correct: 0, total: list.length }; list.forEach(x => c[bucket(k, x.id)]++); return c; }
const inUnit = (list, unit) => unit === 'all' ? list : list.filter(x => x.unit === unit);

/* =========================================================
 * 4択の選択肢
 * ========================================================= */
function distractorsFor(q){
  if (q.type === 'year') {
    const ev = eById.get(q.eventId), seen = new Set([ev.year]), out = [];
    for (const e of EVENTS.filter(x => x.unit === q.unit).sort((a, b) => Math.abs(a.year - ev.year) - Math.abs(b.year - ev.year))) {
      if (seen.has(e.year)) continue; seen.add(e.year); out.push(yearLabel(e));
      if (out.length >= 8) break;
    }
    return out;
  }
  const ng = new Set([q.answer, ...(q.exclude || [])]);
  let c = uniq(TERMS.filter(t => t.unit === q.unit && t.cat === q.cat).map(t => t.term)).filter(a => !ng.has(a));
  if (c.length < 3) c = uniq([...c, ...TERMS.filter(t => t.unit === q.unit).map(t => t.term)]).filter(a => !ng.has(a));
  return c;
}
function buildChoices(q){
  const wrongs = [];
  for (const c of shuffle(distractorsFor(q))) { if (wrongs.length >= 3) break; wrongs.push(c); }
  return shuffle([q.answer, ...wrongs]);
}
function choiceInfo(q, c){
  if (q.type === 'year') {
    const evs = EVENTS.filter(e => e.unit === q.unit && yearLabel(e) === c);
    return { text: evs.map(e => e.title).join('／'), key: null };
  }
  const t = termIn(q.unit, c);
  return { text: t ? t.summary : '', key: t ? t.key : null };
}
function linkedTerms(unit, texts, skip){
  const s = new Set(skip), joined = texts.join('\n'), seen = new Set();
  return TERMS.filter(t => t.unit === unit && t.term.length >= 3 && !s.has(t.term) && joined.includes(t.term) && !seen.has(t.term) && seen.add(t.term)).slice(0, 10);
}

/* =========================================================

 * ========================================================= */
const TITLES = { home: '学習', list: '振り分け', dict: '図鑑', data: 'データ', setup: '出題の設定', result: '結果', round: '問題', bulk: 'まとめて追加', one: '1件ずつ追加', mine: '追加・編集した問題', ruby: 'ふりがなの辞書' };
const routeTitle = r => r.v === 'unit' ? unitName(r.a) : (TITLES[r.v] || '');
const TAB_VIEWS = ['home', 'unit', 'list', 'dict', 'data'];
const stack = [];
const cur = () => stack[stack.length - 1] || { v: 'home' };
function go(route, how = 'push'){
  if (how === 'replace' && stack.length) stack[stack.length - 1] = route;
  else if (how === 'tab') { stack.length = 0; stack.push({ v: 'home' }); if (route.v !== 'home') { stack.push(route); history.pushState({ a: 1 }, ''); } }
  else { stack.push(route); history.pushState({ a: 1 }, ''); }
  render(route);
}
function uiBack(){ if (stack.length > 1) history.back(); else go({ v: 'home' }, 'tab'); }
window.addEventListener('popstate', () => {
  if (!document.getElementById('modal').hidden) closeModal();
  const r = cur();
  if (r.v === 'round' && state.round && state.round.i < state.round.items.length) {
    if (!confirm('中断しますか？\nここまでの振り分けは保存され、「学習」の「続きから再開」から再開できます。')) { history.pushState({ a: 1 }, ''); return; }
    saveSession();
  }
  if (stack.length > 1) stack.pop();
  render(cur(), true);
});
function render(r, keep){
  if (!keep) scrollTo(0, 0);
  switch (r.v) {
    case 'unit': renderUnit(r.a); break;
    case 'setup': renderSetup(r); break;
    case 'round': if (state.round) renderItem(); else renderHome(); break;
    case 'result': if (state.round) renderResult(); else renderHome(); break;
    case 'list': renderList(); break;
    case 'dict': renderDict(); break;
    case 'data': renderData(); break;
    case 'bulk': renderBulk(); break;
    case 'one': renderOne(); break;
    case 'mine': renderMine(); break;
    case 'ruby': renderRuby(); break;
    default: renderHome();
  }
  renderTop();
  app.querySelectorAll('textarea.ta:not(.big)').forEach(autoGrow);
}
function renderTop(){
  const v = cur().v, top = document.getElementById('top'), inn = document.getElementById('topIn');
  const tabView = TAB_VIEWS.includes(v);
  document.getElementById('tabbar').hidden = !tabView;
  app.classList.toggle('flow', !tabView);
  const tabOf = v === 'unit' ? 'home' : v;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.v === tabOf ? 'page' : 'false'));
  if (v === 'round' && state.round) {
    const r = state.round;
    top.hidden = false;
    inn.innerHTML = `<button class="iconbtn" data-act="back" aria-label="中断する">${I('x')}</button>
      <div class="rprog"><i style="width:${r.i / r.items.length * 100}%"></i></div>
      <span class="rnum">${Math.min(r.i + 1, r.items.length)} / ${r.items.length}</span>
      <button class="iconbtn" data-act="toggleSound" aria-label="効果音 ${SET.sound ? 'オン' : 'オフ'}">${I(SET.sound ? 'vol' : 'mute')}</button>`;
  } else if (['home', 'list', 'dict', 'data'].includes(v)) { top.hidden = true; inn.innerHTML = ''; }
  else {
    const parent = stack.length > 1 ? stack[stack.length - 2] : { v: 'home' };
    top.hidden = false;
    inn.innerHTML = `<button class="iconbtn" data-act="back" aria-label="${esc(routeTitle(parent))}に戻る">${I('chevL')}</button><span class="ttl">${esc(routeTitle(parent))}</span>`;
  }
}

/* =========================================================
 * 出題セット
 * ========================================================= */
function makeSortSets(seeds, nSets, unit){
  const all = inUnit(EVENTS, unit);
  const size = Math.min(state.setup.size, uniq(all.map(e => e.year)).length);
  let queue = shuffle(seeds);
  const sets = [];
  for (let k = 0; k < nSets; k++) {
    if (!queue.length) queue = shuffle(seeds);
    const ids = [], years = new Set();
    for (let j = 0; j < queue.length && ids.length < size;) {
      const e = queue[j];
      if (!years.has(e.year)) { ids.push(e.id); years.add(e.year); queue.splice(j, 1); } else j++;
    }
    for (const e of shuffle(all)) { if (ids.length >= size) break; if (!years.has(e.year)) { ids.push(e.id); years.add(e.year); } }
    sets.push({ type: 'sort', ids });
  }
  return sets;
}
function startFromSetup(){
  const r = cur(), kind = r.a, unit = r.u, { pool } = setupPool(kind, unit);
  if (kind === 'quiz') {
    const n = state.setup.count === 'all' ? pool.length : Math.min(state.setup.count, pool.length);
    startRound(shuffle(pool).slice(0, n).map(q => ({ type: 'quiz', id: q.id })), { unit, kind });
  } else startRound(makeSortSets(pool, state.setup.sets, unit), { unit, kind });
}
function quickReview(){
  const u = state.unit, rev = isWeak;
  const qs = shuffle(inUnit(QUESTIONS, u).filter(q => rev(bucket('q', q.id)))).slice(0, 30).map(q => ({ type: 'quiz', id: q.id }));
  const evs = inUnit(EVENTS, u).filter(e => rev(bucket('e', e.id)));
  const nSets = evs.length ? Math.min(5, Math.ceil(evs.length / state.setup.size)) : 0;
  startRound([...qs, ...makeSortSets(evs, nSets, u)], { unit: u, kind: 'quiz' });
}

/* =========================================================
 * 出題
 * ========================================================= */
function startRound(items, origin, how = 'push'){
  if (!items.length) { toast('出題できる問題がありません'); return; }
  const old = loadSession();
  if (old && how !== 'replace' && !confirm(`中断中の問題（${sessionLabel(old)}・あと${old.left}）があります。新しく始めると破棄されます。よろしいですか？`)) return;
  state.round = { items: shuffle(items), i: 0, results: [], origin, cur: null };
  saveSession();
  go({ v: 'round' }, how);
}
function finishRound(){
  const r = state.round, total = r.results.length, ok = r.results.filter(x => x.ok).length;
  clearSession(); state.open = null;
  SFX.finish(total ? ok / total * 100 : 0);
  go({ v: 'result' }, 'replace');
}
function renderItem(){
  const r = state.round;
  while (r.i < r.items.length) {   // 削除された問題は飛ばす
    const it = r.items[r.i];
    if (it.type === 'quiz' ? qById.has(it.id) : it.ids.every(id => eById.has(id))) break;
    r.i++;
  }
  if (r.i >= r.items.length) { finishRound(); return; }
  const it = r.items[r.i];
  if (it.type === 'quiz') renderQuiz(it); else renderSort(it);
}
const prevTag = (k, id) => { const b = bucket(k, id); return b === 'new' ? '' : `<span class="prev"><span class="dot b-${b}"></span>前回 ${BL[b]}</span>`; };
const unsureToggle = () => `<label class="toggle"><input type="checkbox" id="unsure"><span class="sw" aria-hidden="true"></span><span>自信がない</span></label>`;
const isLast = () => state.round.i + 1 >= state.round.items.length;
const nextBar = label => `<div class="actionbar"><button class="btn primary block" data-act="next" id="nextBtn">${label}</button></div>`;

/* ---------- 4択 ---------- */
function renderQuiz(it){
  const q = qById.get(it.id), choices = buildChoices(q);
  state.round.cur = { type: 'quiz', id: q.id, choices, picked: null, ok: null, unsure: false };
  app.innerHTML = `
  <p class="meta"><span>${esc(unitName(q.unit))}／${esc(q.cat)}</span>${prevTag('q', q.id)}</p>
  <h1 class="qtext">${rb(q.question)}</h1>
  <div class="choices" id="choices">${choices.map((c, i) => `<button class="choice" data-act="choose" data-v="${i}"><span class="key">${KEYS[i]}</span><span class="ctext">${rb(c)}</span><span class="cmark"></span></button>`).join('')}
    <button class="choice dontknow" data-act="dontknow">${I('question')}わからない</button></div>
  ${unsureToggle()}
  <div id="fb"></div>`;
}
function choose(i){
  const c = state.round.cur;
  if (!c || c.type !== 'quiz' || c.picked !== null) return;
  const q = qById.get(c.id);
  const unknown = i === -1;
  c.picked = i; c.unknown = unknown; c.ok = !unknown && c.choices[i] === q.answer; c.unsure = document.getElementById('unsure').checked;
  recordAnswer('q', q.id, c.ok, c.unsure, unknown);
  state.streak = c.ok ? state.streak + 1 : 0;
  if (state.streak > P.best) P.best = state.streak;
  saveP(); saveSession();
  if (unknown) SFX.unknown();
  else if (!c.ok) SFX.wrong();
  else if (state.streak >= 3 && (state.streak % 5 === 0 || state.streak === 3)) SFX.streak(state.streak);
  else SFX.correct();
  document.querySelectorAll('#choices .choice').forEach((b, k) => {
    b.disabled = true;
    if (b.classList.contains('dontknow')) { if (!unknown) b.hidden = true; else b.classList.add('is-dim'); return; }
    if (c.choices[k] === q.answer) { b.classList.add('is-ok'); b.querySelector('.cmark').innerHTML = I('check'); }
    else if (k === i) { b.classList.add('is-ng'); b.querySelector('.cmark').innerHTML = I('x'); }
    else b.classList.add('is-dim');
  });
  document.querySelector('.toggle').hidden = true;
  renderQuizFeedback(true);
}
function renderQuizFeedback(first){
  const c = state.round.cur, q = qById.get(c.id);
  if (!q) return;
  const clist = c.choices.map((ch, k) => {
    const info = choiceInfo(q, ch), isAns = ch === q.answer, picked = k === c.picked && !isAns;
    return `<div class="citem ${isAns ? 'ok' : ''} ${picked ? 'picked' : ''}"><span class="ic">${I(isAns ? 'check' : 'x')}</span>
      <div class="ct"><div class="cn">${rb(ch)}${isAns ? '<small>正解</small>' : picked ? '<small>あなたの解答</small>' : ''}</div>
      ${info.text ? `<p class="cs">${rb(info.text)}</p>` : ''}
      ${info.key ? `<button class="textbtn" data-act="term" data-v="${esc(info.key)}">${I('book')}図鑑で見る</button>` : ''}</div></div>`;
  }).join('');
  const links = q.type === 'term' ? linkedTerms(q.unit, [q.question, q.explanation, q.point || ''], c.choices) : [];
  const vb = c.unknown ? 'unknown' : c.ok ? (c.unsure ? 'unsure' : 'correct') : 'wrong';
  const sub = c.unknown ? '解説を読んで、次は解けるようにしましょう'
    : c.ok ? (c.unsure ? '「自信なし」に振り分けました' : state.streak >= 3 ? `${state.streak}問連続で正解` : pick(['その調子です', 'よく覚えています', '正確です', 'いいペースです']))
    : pick(['ここで覚えれば次は解けます', '選択肢の違いも確認しておきましょう', '間違えた問題ほど記憶に残ります']);
  const verdict = c.unknown ? 'わからない' : c.ok ? (state.streak >= 3 ? `正解　${state.streak}連続` : '正解') : '不正解';
  document.getElementById('fb').innerHTML = `
  <div class="verdict b-${vb}"><span class="vi">${I(c.unknown ? 'book' : c.ok ? 'check' : 'x')}</span><div><b>${verdict}</b><span class="vs">${sub}</span></div></div>
  <div class="ansrow"><p class="answer"><span>答え</span>${rb(q.answer)}</p>${editBtn('editQ', q.id)}</div>
  ${memoBlock(memoOf(q))}
  <section class="block"><h3 class="stitle">振り分け ${help('classify')}</h3>${classifySeg('q', q.id)}</section>
  <section class="block"><h3>解説</h3><p class="prose">${rb(q.explanation)}</p></section>
  ${q.point ? `<section class="block note"><h3>覚え方</h3><p class="prose">${rb(q.point)}</p></section>` : ''}
  <details class="block" ${c.ok && !c.unknown ? '' : 'open'}><summary>選択肢の解説${I('chevD')}</summary><div class="clist">${clist}</div></details>
  ${links.length ? `<section class="block"><h3>関連する用語</h3><div class="tchips">${links.map(t => `<button class="tchip" data-act="term" data-v="${esc(t.key)}">${rb(t.term)}</button>`).join('')}</div></section>` : ''}
  ${nextBar(isLast() ? '結果を見る' : '次の問題へ')}`;
  if (first) {
    document.getElementById('nextBtn').focus({ preventScroll: true });
    setTimeout(() => document.querySelector('.verdict')?.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }), 120);
  }
}

/* ---------- 年号並べ替え ---------- */
function renderSort(it){
  const sorted = [...it.ids].sort((a, b) => eById.get(a).year - eById.get(b).year);
  let order = shuffle(it.ids);
  for (let t = 0; t < 6 && order.join() === sorted.join(); t++) order = shuffle(it.ids);
  state.round.cur = { type: 'sort', it, order, sel: null, done: false, ok: null, unsure: false };
  app.innerHTML = `
  <p class="meta">${esc(unitName(eById.get(it.ids[0]).unit))}／年号並べ替え</p>
  <h1 class="qtext" style="display:flex;align-items:center;gap:10px">古い順に並べ替え ${help('sort')}</h1>
  <div id="sortArea"></div>
  ${unsureToggle()}
  <div id="fb"><div class="actionbar"><button class="btn primary block" data-act="submitSort">この順番で解答する</button>
    <button class="btn block" style="margin-top:8px" data-act="sortDontKnow">${I('question')}わからない（正しい順序を見る）</button></div></div>`;
  drawSortList();
}
function sortMarks(order){
  const sorted = [...order].sort((a, b) => eById.get(a).year - eById.get(b).year);
  return order.map((id, i) => eById.get(id).year === eById.get(sorted[i]).year);
}
function drawSortList(){
  const c = state.round.cur, n = c.order.length, marks = c.done ? sortMarks(c.order) : null;
  document.getElementById('sortArea').innerHTML = `
    <div class="axis">古い</div>
    <ol class="slist">${c.order.map((id, i) => {
      const e = eById.get(id), cls = c.done ? (c.unknown ? 'reveal' : marks[i] ? 'ok' : 'ng') : (c.sel === i ? 'sel' : '');
      return `<li class="sitem ${cls}" ${c.done ? '' : `data-act="pick" data-v="${i}" tabindex="0" role="button" aria-label="${i + 1}番目：${esc(e.title)}"`}>
        <span class="no">${c.done ? (c.unknown ? i + 1 : I(marks[i] ? 'check' : 'x')) : i + 1}</span>
        <span class="st">${c.done ? `<span class="yr">${yearLabel(e)}</span>` : ''}${rb(e.title)}</span>
        ${c.done ? '' : `<span class="mv"><button data-act="up" data-v="${i}" aria-label="上へ" ${i === 0 ? 'disabled' : ''}>${I('up')}</button><button data-act="down" data-v="${i}" aria-label="下へ" ${i === n - 1 ? 'disabled' : ''}>${I('down')}</button></span>`}
      </li>`;
    }).join('')}</ol>
    <div class="axis">新しい</div>`;
}
function moveItem(i, d){
  const c = state.round.cur, j = i + d;
  if (c.done || j < 0 || j >= c.order.length) return;
  [c.order[i], c.order[j]] = [c.order[j], c.order[i]];
  c.sel = null; drawSortList();
  const b = document.querySelector(`.sitem:nth-child(${j + 1}) [data-act="${d < 0 ? 'up' : 'down'}"]`);
  (b && !b.disabled ? b : document.querySelector(`.sitem:nth-child(${j + 1})`))?.focus();
}
function pickItem(i){
  const c = state.round.cur;
  if (c.done) return;
  if (c.sel === null) c.sel = i;
  else if (c.sel === i) c.sel = null;
  else { [c.order[c.sel], c.order[i]] = [c.order[i], c.order[c.sel]]; c.sel = null; }
  drawSortList();
}
function submitSort(){
  const c = state.round.cur;
  if (c.done) return;
  c.done = true; c.sel = null;
  const marks = sortMarks(c.order);
  c.ok = marks.every(Boolean); c.unsure = document.getElementById('unsure').checked;
  c.order.forEach((id, i) => recordAnswer('e', id, marks[i], c.unsure));
  state.streak = c.ok ? state.streak + 1 : 0;
  if (state.streak > P.best) P.best = state.streak;
  saveP(); saveSession();
  if (!c.ok) SFX.wrong(); else if (state.streak >= 3 && (state.streak % 5 === 0 || state.streak === 3)) SFX.streak(state.streak); else SFX.correct();
  drawSortList();
  document.querySelector('.toggle').hidden = true;
  renderSortFeedback(true);
}
function sortDontKnow(){
  const c = state.round.cur;
  if (c.done) return;
  c.done = true; c.sel = null; c.unknown = true; c.ok = false;
  c.order = [...c.order].sort((a, b) => eById.get(a).year - eById.get(b).year);
  c.order.forEach(id => recordAnswer('e', id, false, false, true));
  state.streak = 0; saveP(); saveSession(); SFX.unknown();
  drawSortList();
  document.querySelector('.toggle').hidden = true;
  renderSortFeedback(true);
}
function renderSortFeedback(first){
  const c = state.round.cur, marks = sortMarks(c.order), okN = marks.filter(Boolean).length;
  const sorted = [...c.order].sort((a, b) => eById.get(a).year - eById.get(b).year);
  document.getElementById('fb').innerHTML = `
  <div class="verdict b-${c.unknown ? 'unknown' : c.ok ? (c.unsure ? 'unsure' : 'correct') : 'wrong'}"><span class="vi">${I(c.unknown ? 'book' : c.ok ? 'check' : 'x')}</span>
    <div><b>${c.unknown ? 'わからない' : c.ok ? '正解' : `${marks.length}個中${okN}個が正しい位置`}</b><span class="vs">${c.unknown ? '正しい順序と解説を読んで、次は並べられるようにしましょう' : c.ok ? '時代の流れがつかめています' : '正しい順序を確認しておきましょう'}</span></div></div>
  <section class="block"><h3 class="stitle">正しい順序と振り分け ${help('classify')}</h3>${timeline(sorted, true)}</section>
  ${nextBar(isLast() ? '結果を見る' : '次のセットへ')}`;
  if (first) document.getElementById('nextBtn').focus({ preventScroll: true });
}
function timeline(ids, inRound){
  return `<ol class="tl">${ids.map(id => {
    const e = eById.get(id), memo = memoOfEvent(e);
    return `<li><div class="y">${e.year}<small>${esc(e.era || '')}</small></div><div><p class="t">${rb(e.title)}</p><p class="x">${rb(e.explanation || '')}</p>

      ${inRound ? classifySeg('e', e.id) + `<div class="btnrow">${editBtn('editE', e.id)}</div>` : `<div class="btnrow">${editBtn('editE', e.id)}</div>`}</div></li>`;
  }).join('')}</ol>`;
}
function next(){
  const r = state.round, c = r.cur;
  if (!c || (c.type === 'quiz' ? c.picked === null : !c.done)) return;
  r.results.push({ item: r.items[r.i], ok: c.ok });
  r.i++; r.cur = null;
  if (r.i >= r.items.length) finishRound();
  else { saveSession(); renderItem(); renderTop(); scrollTo(0, 0); }
}

function unitBucket(x){
  if (x.item.type === 'quiz') return bucket('q', x.item.id);
  const bs = x.item.ids.map(id => bucket('e', id));
  return bs.includes('wrong') ? 'wrong' : bs.includes('unknown') ? 'unknown' : bs.includes('unsure') ? 'unsure' : 'correct';
}

    ${eIds.length ? `<ul class="rows" style="margin-top:12px">${eIds.map(id => eRow(eById.get(id))).join('')}</ul>` : ''}

const KEYMAP = { '単元': 'unit', '用語': 'term', '人物': 'term', '見出し': 'term', '答え': 'term', '読み': 'kana', '分野': 'cat', '要約': 'summary', '解説': 'detail', '問題': 'q', '問題文': 'q', '覚え方': 'point', 'ポイント': 'point', '除外': 'exclude', 'メモ': 'memo', '年': 'year', '西暦': 'year', '和暦': 'era', '時代': 'group', '出来事': 'title' };
const toHalf = s => String(s || '').replace(/[０-９]/g, d => String('０１２３４５６７８９'.indexOf(d)));
function parseText(text){
  const blocks = [[]];
  for (const ln of String(text || '').replace(/\r\n?/g, '\n').split('\n')) {
    if (/^\s*([-ー―=＝]\s*){3,}\s*$/.test(ln)) blocks.push([]); else blocks[blocks.length - 1].push(ln);
  }
  const items = [], errors = [];
  blocks.forEach((bl, bi) => {
    const o = {}; let last = null;
    for (const raw of bl) {
      if (/^\s*```/.test(raw) || /^\s*#/.test(raw)) continue;
      const ln = raw.replace(/\*\*/g, '').replace(/^\s*(?:[-*・]\s+)/, '');
      const m = ln.match(/^\s*[【\[]?\s*([^:：\]】\s]{1,5})\s*[\]】]?\s*[:：]\s*(.*)$/);
      if (m && KEYMAP[m[1]]) {
        const k = KEYMAP[m[1]], v = m[2].trim();
        if (k === 'q') o.q = [...(o.q || []), v]; else o[k] = v;
        last = k; continue;
      }
      const t = ln.trim();
      if (!t || !last) continue;
      if (last === 'q') o.q[o.q.length - 1] = (o.q[o.q.length - 1] ? o.q[o.q.length - 1] + '\n' : '') + t;
      else o[last] = (o[last] ? o[last] + '\n' : '') + t;
    }
    if (o.q) o.q = o.q.map(s => s.trim()).filter(Boolean);
    clean(o);
    if (!Object.keys(o).length) return;
    const no = items.length + errors.length + 1;
    if (o.year || o.title) {
      const y = parseInt((toHalf(o.year).match(/\d{3,4}/) || [])[0], 10);
      if (!y || !o.title) { errors.push(`${no}件目：年号の出来事には「年」と「出来事」が必要です`); return; }
      items.push(clean({ kind: 'event', year: y, era: o.era, group: o.group, title: o.title, explanation: o.detail || o.summary, unit: o.unit, memo: o.memo }));
    } else {
      if (!o.term || !o.summary) { errors.push(`${no}件目${o.term ? `（${o.term}）` : ''}：「用語」と「要約」が必要です`); return; }
      items.push(clean({ kind: 'term', term: o.term, kana: o.kana, cat: o.cat || 'その他', summary: o.summary, detail: o.detail,
        q: o.q ? (o.q.length === 1 ? o.q[0] : o.q) : undefined, point: o.point,
        exclude: o.exclude ? o.exclude.split(/[、,，]/).map(s => s.trim()).filter(Boolean) : undefined, unit: o.unit, memo: o.memo }));
    }
  });
  return { items, errors };
}
function addItems(items, target, newName){
  const created = {};
  const unitFor = name => {
    if (!name) return target;
    const u = UNITS.find(x => x.name === name) || U.units.find(x => x.name === name);
    if (u) return u.id;
    if (!created[name]) { const id = 'u' + uid(); U.units.push({ id, name, icon: 'book', order: 100 + U.units.length, yearQuiz: true }); created[name] = id; }
    return created[name];
  };
  if (target === '__new') {
    const name = (newName || '').trim() || '自分で追加した問題';
    target = unitFor(name);
  }
  const haveT = new Set(TERMS.map(t => t.unit + '::' + t.term)), haveE = new Set(EVENTS.map(e => e.unit + '::' + e.year + e.title));
  let added = 0, skipped = 0;
  for (const it of items) {
    const unit = unitFor(it.unit);
    const { kind, memo, unit: _u, ...rest } = it;
    if (kind === 'term') {
      if (haveT.has(unit + '::' + it.term)) { skipped++; continue; }
      const id = uid(); U.terms.push({ id, unit, ...rest }); haveT.add(unit + '::' + it.term);
      if (memo) U.memos['k:' + unit + '::@' + id] = memo;
    } else {
      if (haveE.has(unit + '::' + it.year + it.title)) { skipped++; continue; }
      const id = 'ue' + uid(); U.events.push({ id, unit, ...rest }); haveE.add(unit + '::' + it.year + it.title);
      if (memo) U.memos['e:' + id] = memo;
    }
    added++;
  }
  saveU(); buildData();
  return { added, skipped, unit: target };
}

  return `<div class="pv"><b>読み取り結果</b>
    <p style="margin:4px 0 0">用語 ${nT}件（うち4択問題 ${nQ}件）／年号 ${nE}件</p>
    ${errors.length ? `<ul class="err">${errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}
    ${items.length ? `<details><summary>内容を確認する</summary><ol>${items.map(x => `<li>${x.kind === 'term' ? `<strong>${esc(x.term)}</strong>（${esc(x.cat)}）` : `<strong>${x.year}</strong> ${esc(x.title)}`}</li>`).join('')}</ol></details>` : ''}
  </div>`;
}
function renderBulk(){
  const B = state.bulk;
  if (!B.unit || (B.unit !== '__new' && !unitById.has(B.unit))) B.unit = UNITS[0]?.id || '__new';
  const n = B.text.trim() ? parseText(B.text).items.length : 0;
  app.innerHTML = `
  <h1 class="ptitle">まとめて追加 ${help('bulk')}</h1>
  <div class="btns" style="margin-top:20px">
    <button class="btn block" data-act="copyTpl">${I('copy')}AIへの指示をコピー</button>
  </div>
  <section class="fgroup">
    <h2 class="stitle">追加先</h2>
    ${unitSelect('bulkUnit', B.unit)}
    ${B.unit === '__new' ? `<input class="inp" style="margin-top:8px" id="bulkNew" value="${esc(B.newName)}" placeholder="新しい単元の名前" autocomplete="off">` : ''}
  </section>
  <section class="fgroup">
    <h2 class="stitle">内容</h2>
    <textarea class="ta big" id="bulkText" placeholder="AIの出力を貼り付け">${esc(B.text)}</textarea>
    <div class="btnrow">
      <label class="textbtn filebtn">${I('file')}テキストファイルを読み込む<input type="file" id="bulkFile" accept=".txt,.md,text/plain"></label>
      ${B.text ? `<button class="textbtn" data-act="bulkClear">${I('x')}消去</button>` : ''}

    <div id="bulkPv">${bulkPreviewHTML()}</div>
  </section>
  <div class="actionbar static"><button class="btn primary block" id="bulkAdd" data-act="bulkAdd" ${n ? '' : 'disabled'}>${n ? `${n}件を追加する` : '追加する'}</button></div>`;
}
let bulkTimer = null;
function onBulkInput(){
  clearTimeout(bulkTimer);
  bulkTimer = setTimeout(() => {
    state.bulk.done = null;
    document.getElementById('bulkPv').innerHTML = bulkPreviewHTML();
    const n = state.bulk.text.trim() ? parseText(state.bulk.text).items.length : 0;
    const b = document.getElementById('bulkAdd');
    b.disabled = !n; b.textContent = n ? `${n}件を追加する` : '追加する';
  }, 250);
}
async function copyTemplate(){
  try { await navigator.clipboard.writeText(TEMPLATE); toast('AIへの指示をコピーしました'); }
  catch (_) {
    openModal(`<h2 class="sheet-t">AIへの指示</h2><p class="hint">全体を選択してコピーしてください</p><textarea class="ta big" readonly id="tplArea">${esc(TEMPLATE)}</textarea>`);
    const ta = document.getElementById('tplArea'); ta.focus(); ta.select();
  }
}

/* ---------- 1件ずつ追加 ---------- */
function renderOne(){
  const O = state.one;
  if (!O.unit || (O.unit !== '__new' && !unitById.has(O.unit))) O.unit = UNITS[0]?.id || '__new';
  const f = O.f, cats = O.unit === '__new' ? [] : catsOfUnit(O.unit), groups = O.unit === '__new' ? [] : groupsOfUnit(O.unit);
  app.innerHTML = `
  <h1 class="ptitle">1件ずつ追加 ${help('one')}</h1>
  <div class="seg" style="margin-top:20px">
    <button data-act="oneKind" data-v="term" aria-pressed="${O.kind === 'term'}">用語・問題</button>
    <button data-act="oneKind" data-v="event" aria-pressed="${O.kind === 'event'}">年号の出来事</button>
  </div>
  <form id="oneForm">
    <div class="fld"><label for="oneUnit">追加先</label>${unitSelect('oneUnit', O.unit)}
      ${O.unit === '__new' ? `<input class="inp" style="margin-top:8px" id="oneNew" value="${esc(O.newName)}" placeholder="新しい単元の名前" autocomplete="off">` : ''}</div>
    ${O.kind === 'term' ? `
      ${fld('答え（用語・人物）', 'term', f.term || '', 'inp', true)}
      ${fld('問題文', 'q', f.q || '', 'ta', false, null, '答えの名前を含めずに書く')}
      ${fld('要約', 'summary', f.summary || '', 'ta', true, null, '誤りの選択肢になったときにも表示されます')}
      ${fld('解説', 'detail', f.detail || '', 'ta')}
      ${fld('覚え方', 'point', f.point || '', 'ta')}
      ${fld('分野', 'cat', f.cat || '', 'inp', false, cats, cats[0] || '例：西洋の人物')}
      ${fld('読み', 'kana', f.kana || '')}` : `
      ${fld('出来事', 'title', f.title || '', 'ta', true)}
      ${fld('年（西暦）', 'year', f.year || '', 'num', true, null, '例：1872')}
      ${fld('和暦', 'era', f.era || '', 'inp', false, null, '例：明治5')}
      ${fld('解説', 'explanation', f.explanation || '', 'ta')}
      ${fld('時代', 'group', f.group || '', 'inp', false, groups)}`}
    <div class="actionbar static"><button type="submit" class="btn primary block">追加する</button></div>
  </form>`;
}
function submitOne(){
  const O = state.one, f = O.f;
  let item;
  if (O.kind === 'term') {
    if (!(f.term || '').trim() || !(f.summary || '').trim()) { toast('答えと要約は必須です'); return; }
    const qs = (f.q || '').split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    item = clean({ kind: 'term', term: f.term.trim(), kana: (f.kana || '').trim(), cat: (f.cat || '').trim() || 'その他', summary: f.summary.trim(),
      detail: (f.detail || '').trim(), point: (f.point || '').trim(), q: qs.length > 1 ? qs : qs[0] });
  } else {
    const y = parseInt(toHalf(f.year), 10);
    if (!(f.title || '').trim() || !y) { toast('出来事と年は必須です'); return; }
    item = clean({ kind: 'event', title: f.title.trim(), year: y, era: (f.era || '').trim(), explanation: (f.explanation || '').trim(), group: (f.group || '').trim() });
  }
  const r = addItems([item], O.unit, O.newName);
  if (!r.added) { toast('同じ内容がすでにあります'); return; }
  if (O.unit === '__new') O.unit = r.unit;
  O.f = O.kind === 'term' ? { cat: f.cat } : { group: f.group };
  render(cur(), true); toast('追加しました');
}

/* ---------- 追加・編集・メモした問題 ---------- */
function renderMine(){
  const addedT = TERMS.filter(t => t.user), addedE = EVENTS.filter(e => e.user);
  const editedT = TERMS.filter(t => t.edited), editedE = EVENTS.filter(e => e.edited);
  const memoT = TERMS.filter(t => U.memos['k:' + t.key]), memoE = EVENTS.filter(e => U.memos['e:' + e.id]);
  const rowT = t => `<li class="row"><button class="drow" data-act="editT" data-v="${esc(t.key)}"><div class="dh"><span class="dn">${esc(t.term)}</span><span class="dk">${esc(unitName(t.unit))}</span></div><p class="ds">${esc(U.memos['k:' + t.key] || qList(t.q)[0] || t.summary)}</p></button></li>`;
  const rowE = e => `<li class="row"><button class="drow" data-act="editE" data-v="${esc(e.id)}"><div class="dh"><span class="dn">${e.year}</span><span class="dk">${esc(unitName(e.unit))}</span></div><p class="ds">${esc(U.memos['e:' + e.id] || e.title)}</p></button></li>`;
  const sec = (title, ts, es) => ts.length + es.length ? `<section class="sect"><h2 class="stitle">${title}（${ts.length + es.length}）</h2><ul class="rows">${ts.map(rowT).join('')}${es.map(rowE).join('')}</ul></section>` : '';
  const body = sec('メモ', memoT, memoE) + sec('追加した問題', addedT, addedE) + sec('編集した問題', editedT, editedE);
  app.innerHTML = `<h1 class="ptitle">追加・編集した問題</h1>${body || '<p class="empty">まだありません</p>'}`;
}

/* ---------- ふりがなの辞書 ---------- */
function renderRuby(){
  const lines = Object.entries(U.ruby || {}).map(([k, v]) => `${k}=${v}`).join('\n');
  app.innerHTML = `
  <h1 class="ptitle">ふりがなの辞書 ${help('ruby')}</h1>
  <p class="psub">登録済み ${Object.keys(RUBY_MAP).length}語</p>
  <form id="rubyForm">
    <div class="fld"><label for="rubyText">自分で追加した読み</label><textarea class="ta big" id="rubyText" placeholder="恩物=おんぶつ">${esc(lines)}</textarea></div>
    <div class="actionbar static"><button type="submit" class="btn primary block">保存する</button></div>
  </form>
  <section class="sect"><h2 class="stitle">確認</h2>
    <label class="search" style="margin-top:0">${I('search')}<input id="rubyQ" type="search" placeholder="語を入力すると読みを表示" aria-label="読みを確認"></label>
    <p class="prose" id="rubyOut" style="margin-top:10px"></p></section>`;

/* ---------- バックアップ ---------- */
function exportBackup(){
  const data = { app: 'hoikushi-anki-note', version: 1, exportedAt: new Date().toISOString(), progress: P, user: U };
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `anki-note-backup-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('書き出しました');
}
function importBackup(file){
  const rd = new FileReader();
  rd.onload = () => {
    let data;
    try { data = JSON.parse(rd.result); } catch (_) { toast('ファイルを読み込めませんでした'); return; }
    if (!data || data.app !== 'hoikushi-anki-note' || !data.user || !data.progress) { toast('このアプリのバックアップではありません'); return; }
    const when = data.exportedAt ? new Date(data.exportedAt).toLocaleString('ja-JP') : '';
    if (!confirm(`${when ? when + ' の' : ''}バックアップで、今の学習記録・編集・メモ・追加した問題を置き換えます。よろしいですか？`)) return;
    P = { ...blankP(), ...data.progress }; U = { ...blankU(), ...data.user };
    saveP(); saveU(); buildData(); render(cur(), true); toast('復元しました');
  };
  rd.readAsText(file);
}

/* =========================================================
 * 操作
 * ========================================================= */
document.addEventListener('click', ev => {
  SFX.unlock();
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v, S = state.setup;
  switch (act) {
    case 'tab': go({ v }, 'tab'); break;
    case 'back': uiBack(); break;
    case 'help': openModal(`<h2 class="sheet-t">${esc(HELP[v][0])}</h2><p class="prose">${esc(HELP[v][1])}</p>`); break;
    case 'goUnit': closeModal(); go({ v: 'unit', a: v }); break;
    case 'unitList': state.list.unit = state.unit; state.list.filter = 'all'; state.open = null; go({ v: 'list' }); break;
    case 'unitDict': {
      const hasT = TERMS.some(t => state.unit === 'all' || t.unit === state.unit);
      Object.assign(state.dict, { tab: hasT ? 'terms' : 'years', unit: hasT ? state.unit : 'all', cat: 'all', q: '' });
      go({ v: 'dict' }); break;
    }
    case 'unitAdd': state.bulk.unit = state.unit; state.bulk.done = null; go({ v: 'bulk' }); break;
    case 'setupQuiz': go({ v: 'setup', a: 'quiz', u: state.unit }); break;
    case 'setupSort': go({ v: 'setup', a: 'sort', u: state.unit }); break;
    case 'quickReview': quickReview(); break;
    case 'sbucket': { const k = cur().a, B = S.buckets[k]; B.has(v) ? B.delete(v) : B.add(v); render(cur(), true); break; }
    case 'sall': S.buckets[cur().a] = new Set(ORDER); render(cur(), true); break;
    case 'sreview': S.buckets[cur().a] = new Set(WEAK); render(cur(), true); break;
    case 'scat': { const s = selectedCats(cur().a, cur().u); s.has(v) ? s.delete(v) : s.add(v); render(cur(), true); break; }
    case 'scount': S.count = v === 'all' ? 'all' : +v; render(cur(), true); break;
    case 'ssets': S.sets = +v; render(cur(), true); break;
    case 'ssize': S.size = +v; render(cur(), true); break;
    case 'startSetup': startFromSetup(); break;
    case 'choose': choose(+v); break;
    case 'up': ev.stopPropagation(); moveItem(+v, -1); break;
    case 'down': ev.stopPropagation(); moveItem(+v, 1); break;
    case 'pick': pickItem(+v); break;
    case 'submitSort': submitSort(); break;
    case 'next': next(); break;
    case 'classify':
      setBucket(el.dataset.k, el.dataset.id, v);
      if (cur().v === 'round') el.closest('.seg3').outerHTML = classifySeg(el.dataset.k, el.dataset.id, el.dataset.new === '1');
      else render(cur(), true);
      toast(`「${BL[v]}」に振り分けました`);
      break;
    case 'open': state.open = state.open === v ? null : v; render(cur(), true); break;
    case 'retryReview': retry('review'); break;
    case 'retryAll': retry('all'); break;
    case 'setupAgain': {
      const o = state.round.origin, prev = stack[stack.length - 2];
      if (prev && prev.v === 'setup') uiBack(); else go({ v: 'setup', a: o.kind === 'sort' ? 'sort' : 'quiz', u: o.unit }, 'replace');
      break;
    }
    case 'lunit': state.list.unit = v; state.list.filter = 'all'; state.open = null; render(cur()); break;
    case 'lkind': state.list.kind = v; state.list.filter = 'all'; state.open = null; render(cur(), true); break;
    case 'lfilter': state.list.filter = v; state.open = null; render(cur(), true); break;
    case 'listStart': listStart(); break;
    case 'resetList': {
      const { k, all } = listItems();
      if (confirm(`表示中の${all.length}件を「未回答」に戻します。よろしいですか？`)) { all.forEach(x => delete P[k][x.id]); saveP(); state.open = null; render(cur(), true); toast('未回答に戻しました'); }
      break;
    }
    case 'dtab': state.dict.tab = v; state.dict.q = ''; render(cur()); break;
    case 'dunit': state.dict.unit = v; state.dict.cat = 'all'; render(cur(), true); break;
    case 'dcat': state.dict.cat = v; render(cur(), true); break;
    case 'term': openTerm(v); break;
    case 'closeModal': closeModal(); break;
    case 'editQ': { const q = qById.get(v); if (!q) break; q.type === 'term' ? openEditTerm(q.termKey) : openEditEvent(q.eventId); break; }
    case 'editT': openEditTerm(v); break;
    case 'editE': openEditEvent(v); break;
    case 'revert':
      if (confirm('編集を取り消して、元の内容に戻しますか？（メモは残ります）')) { delete U.edits[v]; saveU(); buildData(); afterDataChange(); toast('元に戻しました'); }
      break;
    case 'delTerm': {
      if (!confirm('この問題を削除しますか？')) break;
      U.terms = U.terms.filter(x => el.dataset.v !== x.unit + '::@' + x.id); delete U.memos['k:' + v];
      saveU(); buildData(); afterDataChange(); toast('削除しました'); break;
    }
    case 'delEvent': {
      if (!confirm('この出来事を削除しますか？')) break;
      U.events = U.events.filter(x => x.id !== v); delete U.memos['e:' + v];
      saveU(); buildData(); afterDataChange(); toast('削除しました'); break;
    }
    case 'goBulk': state.bulk.done = null; go({ v: 'bulk' }); break;
    case 'goOne': go({ v: 'one' }); break;
    case 'goMine': go({ v: 'mine' }); break;
    case 'copyTpl': copyTemplate(); break;
    case 'bulkClear': state.bulk.text = ''; state.bulk.done = null; render(cur(), true); break;
    case 'bulkAdd': {
      const { items } = parseText(state.bulk.text);
      if (!items.length) break;
      if (state.bulk.unit === '__new' && !state.bulk.newName.trim()) { toast('新しい単元の名前を入力してください'); document.getElementById('bulkNew')?.focus(); break; }
      const r = addItems(items, state.bulk.unit, state.bulk.newName);
      state.bulk = { unit: r.unit, newName: '', text: '', done: r };
      render(cur(), true); toast(`${r.added}件を追加しました`);
      break;
    }
    case 'oneKind': state.one.kind = v; render(cur(), true); break;
    case 'exportBackup': exportBackup(); break;
    case 'dontknow': choose(-1); break;
    case 'sortDontKnow': sortDontKnow(); break;
    case 'resume': resumeSession(); break;
    case 'discardSession': if (confirm('中断中の問題を破棄しますか？（振り分けは残ります）')) { clearSession(); render(cur(), true); } break;
    case 'toggleSound': SET.sound = !SET.sound; saveSet(); if (SET.sound) { SFX.unlock(); SFX.correct(); } if (cur().v === 'round') renderTop(); else render(cur(), true); toast(`効果音を${SET.sound ? 'オン' : 'オフ'}にしました`); break;
    case 'toggleRuby': SET.ruby = !SET.ruby; saveSet(); render(cur(), true); break;
    case 'goRuby': go({ v: 'ruby' }); break;
    case 'resetAll':
      if (confirm('すべての学習記録（振り分け）を消去します。編集・メモ・追加した問題は残ります。よろしいですか？')) { P = blankP(); saveP(); render(cur(), true); toast('リセットしました'); }
      break;
  }
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'editForm') { if (saveEdit(ev.target)) { afterDataChange(); toast('保存しました'); } }
  else if (ev.target.id === 'oneForm') submitOne();
  else if (ev.target.id === 'rubyForm') {
    const m = {};
    for (const ln of document.getElementById('rubyText').value.split('\n')) {
      const mm = ln.match(/^\s*([^=＝]+?)\s*[=＝]\s*(.*?)\s*$/);
      if (mm) m[mm[1]] = mm[2];
    }
    U.ruby = m; saveU(); buildRuby(); render(cur(), true); toast('保存しました');
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.matches && t.matches('textarea.ta:not(.big)')) autoGrow(t);
  if (t.id === 'dictQ') { state.dict.q = t.value; drawDict(); }
  else if (t.id === 'rubyQ') { const v = t.value.trim(); document.getElementById('rubyOut').innerHTML = v ? (RUBY_MAP[v] ? rb(v) + '　' + esc(RUBY_MAP[v]) : rb(v)) : ''; }
  else if (t.id === 'bulkText') { state.bulk.text = t.value; onBulkInput(); }
  else if (t.id === 'bulkNew') state.bulk.newName = t.value;
  else if (t.id === 'oneNew') state.one.newName = t.value;
  else if (t.closest('#oneForm') && t.dataset.f && t.dataset.f !== 'unit') state.one.f[t.dataset.f] = t.value;
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'bulkUnit') { state.bulk.unit = t.value; render(cur(), true); }
  else if (t.id === 'oneUnit') { state.one.unit = t.value; render(cur(), true); }
  else if (t.id === 'importFile' && t.files[0]) { importBackup(t.files[0]); t.value = ''; }
  else if (t.id === 'bulkFile' && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { state.bulk.text = (state.bulk.text ? state.bulk.text.trim() + '\n---\n' : '') + String(rd.result); state.bulk.done = null; render(cur(), true); toast('読み込みました'); };
    rd.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !document.getElementById('modal').hidden) { closeModal(); return; }
  const r = state.round;
  if (cur().v !== 'round' || !r || !r.cur || /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName) || !document.getElementById('modal').hidden) return;
  if (r.cur.type === 'quiz' && r.cur.picked === null && /^[1-4]$/.test(ev.key)) { choose(+ev.key - 1); ev.preventDefault(); }
  else if (r.cur.type === 'quiz' && r.cur.picked === null && (ev.key === '0' || ev.key === '?')) { choose(-1); ev.preventDefault(); }
  else if (ev.key === 'Enter' && ev.target.classList.contains('sitem')) { pickItem(+ev.target.dataset.v); ev.preventDefault(); }
});

buildData();
history.replaceState({ a: 1 }, '');
go({ v: 'home' }, 'tab');
})();
