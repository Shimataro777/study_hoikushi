  setTimeout(() => document.querySelector('.verdict')?.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'center' }), 250);
}

/* ---------- まとめて答える（対応づけ） ----------
   1問＝ひとつの表。すべての行が同じ選択肢を使うので、行どうしを比べながら答える。
   行の順番はまぜ、選択肢は時期の早い順のまま出す */
function renderDevMatch(it){
  const m = dMatch(it.id), n = m.rows.length;
  let order = shuffle([...Array(n).keys()]);
  while (n > 2 && order.every((x, i) => x === i)) order = shuffle(order);
  state.round.cur = { type: 'dmat', id: m.id, order, ans: {}, done: false, ok: null, unsure: false };
  app.innerHTML = `
  <p class="meta"><span>${esc(unitName(dUnitOf(m.id)))}／まとめて答える</span>${prevTag('d', m.id)}</p>
  <h1 class="qtext">${rb(m.title)}</h1>
  <p class="qlead">${rb(m.lead)}　それぞれの行で選びましょう（同じ答えを何度使ってもかまいません）。</p>
  <p class="sprog" id="sprog"></p>
  <ol class="sgrid">${order.map((r, k) => `<li class="srow" id="mr-${r}">
    <div class="sname dstmt"><span class="sno">${k + 1}</span><span>${rb(m.rows[r][0])}</span></div>
    <div class="mpick" role="group">${m.opts.map((o, j) => `<button type="button" data-act="mpick" data-r="${r}" data-v="${j}" aria-pressed="false">${rb(o)}</button>`).join('')}<button type="button" data-act="mpick" data-r="${r}" data-v="unk" class="mp-unk" aria-pressed="false">？ わからない</button></div>
    <div class="sfb" hidden></div>
  </li>`).join('')}</ol>
  ${unsureToggle()}
  <div id="fb"><div class="actionbar static"><button class="btn block" data-act="devMatDontKnow">${I('question')}残りをすべて「わからない」にして答えを見る</button></div></div>`;
  devMatProgress();
}
const mAns = (m, r) => String(m.opts.indexOf(m.rows[r][1]));
function devMatProgress(){
  const c = state.round.cur, m = dMatch(c.id);
  const done = m.rows.filter((_, r) => c.ans[r] !== undefined), ok = m.rows.filter((_, r) => c.ans[r] === mAns(m, r)).length;
  const el = document.getElementById('sprog');
  if (el) el.innerHTML = `<span>回答 <b>${done.length}</b> / ${m.rows.length}</span><span>正解 <b>${ok}</b></span>${done.length - ok ? `<span class="ng">不正解・わからない <b>${done.length - ok}</b></span>` : ''}`;
}
function mPaintRow(r, v){
  const m = dMatch(state.round.cur.id), row = m.rows[r], code = mAns(m, r), ok = v === code;
  const li = document.getElementById('mr-' + r); if (!li) return;
  const cls = v === 'unk' ? 'unk' : ok ? 'ok' : 'ng';
  li.classList.add('done', cls);
  li.querySelectorAll('.mpick button').forEach(b => {
    b.disabled = true;
    if (b.dataset.v === v) { b.setAttribute('aria-pressed', 'true'); b.classList.add(ok ? 'is-ok' : 'is-ng'); }
    if (b.dataset.v === code && !ok) b.classList.add('is-ans');
  });
  const fb = li.querySelector('.sfb');
  fb.innerHTML = `<div class="sfb-h ${cls}">${I(cls === 'ok' ? 'check' : cls === 'ng' ? 'x' : 'book')}<b>${cls === 'ok' ? '正解' : cls === 'ng' ? '不正解' : '答え'}</b><span class="sfb-a">${rb(row[1])}</span></div>${row[2] ? `<p class="sfb-w">${rb(row[2])}</p>` : ''}`;
  fb.hidden = false;
}
function devMatPick(el){
  const c = state.round && state.round.cur;
  if (!c || c.type !== 'dmat' || c.done || c.ans[el.dataset.r] !== undefined) return;
  const m = dMatch(c.id), r = +el.dataset.r, v = el.dataset.v;
  c.ans[r] = v;
  mPaintRow(r, v); devMatProgress();
  const last = m.rows.every((_, i) => c.ans[i] !== undefined);
  const allOk = last && m.rows.every((_, i) => c.ans[i] === mAns(m, i));
  if (!allOk) { if (v === 'unk') SFX.rowUnk(); else if (v === mAns(m, r)) SFX.rowOk(); else SFX.rowNg(); }
  if (last) devMatComplete();
}
function devMatDontKnow(){
  const c = state.round && state.round.cur;
  if (!c || c.type !== 'dmat' || c.done) return;

}
function devMatComplete(){

  const unk = m.rows.filter((_, r) => c.ans[r] === 'unk').length;
  devRecord(c, wrong, unk);

  /* 正しい対応を、選択肢（時期）の順にまとめて見せる */

  <section class="block"><h3>まとめると</h3><div class="mgrp">${groups.map(g => `<div><span class="mgo">${rb(g.o)}</span><span class="mgr">${g.rows.map(x => `<button class="mgi ${c.ans[x.r] === mAns(m, x.r) ? '' : 'ng'}" data-act="mJump" data-v="${x.r}">${rb(x.row[0])}</button>`).join('')}</span></div>`).join('')}</div>
    <p class="hint" style="margin-top:8px">赤い項目がまちがえたところ。押すとその行へ移動します。</p></section>
  ${m.point ? `<section class="block note"><h3>この分野の整理</h3><p class="prose">${rb(m.point)}</p></section>` : ''}

/* ---------- 早見表（分野ごと） ---------- */
const DEV_GENRES = () => DV ? uniq(DV.areas.map(a => a.genre)) : [];
function tableGroups(genre){
  const areaOf = {};
  for (const x of [...DV.checks, ...DV.orders]) for (const sp of (x.tbl || [])) { const k = Array.isArray(sp) ? sp[0] : sp; if (!areaOf[k]) areaOf[k] = x.area; }
  const def = (DV.areas.find(a => a.id === 'dev') || DV.areas[0] || {}).id;
  return (DV.areas || []).filter(a => !genre || a.genre === genre).map(a => ({ a, keys: Object.keys(DV.tables).filter(k => (areaOf[k] || def) === a.id) })).filter(g => g.keys.length);
}
const tipsOf = genre => (DV.tips || []).map(x => typeof x === 'string' ? { g: 'all', t: x } : x).filter(x => !genre || x.g === 'all' || x.g === genre);
/* 今解いている問題の分野（早見表をその分野だけにする） */

function unitBucket(x){
  if (x.item.type === 'quiz') return bucket('q', x.item.id);
  if (x.item.type === 'staff') return bucket('s', x.item.id);
  if (['dchk', 'dord', 'dmat'].includes(x.item.type)) return bucket('d', x.item.id);
  const bs = x.item.ids.map(id => bucket('e', id));
  return bs.includes('wrong') ? 'wrong' : bs.includes('unknown') ? 'unknown' : bs.includes('unsure') ? 'unsure' : 'correct';
}
function renderResult(){
  const r = state.round, res = r.results, total = res.length, ok = res.filter(x => x.ok).length;
  const c = { correct: 0, unsure: 0, wrong: 0, unknown: 0, new: 0 };
  res.forEach(x => c[unitBucket(x)]++);
  const review = res.filter(x => isWeak(unitBucket(x)));
  const qIds = uniq(res.filter(x => x.item.type === 'quiz').map(x => x.item.id)).filter(id => qById.has(id));
  const eIds = uniq(res.filter(x => x.item.type === 'sort').flatMap(x => x.item.ids)).filter(id => eById.has(id));
  const sIds = uniq(res.filter(x => x.item.type === 'staff').map(x => x.item.id)).filter(id => sFac(id));

  <h1 class="ptitle">おつかれさまでした</h1>

  <div class="btns" style="margin-top:20px">
    ${review.length ? `<button class="btn primary block" data-act="retryReview">苦手をもう一度（${review.length}）</button>` : ''}
    <button class="btn block ${review.length ? '' : 'primary'}" data-act="retryAll">同じ問題をもう一度</button>
    <button class="btn block" data-act="setupAgain">${r.origin.kind === 'staff' ? '単元に戻る' : r.origin.kind === 'dev' ? '○×チェックに戻る' : '条件を変えて解く'}</button>
  </div>
  <div class="foot"><button class="textbtn" data-act="back">終了する</button></div>
  <section class="sect">
    <h2 class="stitle">今回の問題</h2>

    ${dIds.length ? `<div class="menu" style="margin-top:12px">${dIds.map(id => { const x = dItem(id), b = bucket('d', id); return `<button class="mrow" data-act="devOne" data-v="${esc(id)}"><span class="dot b-${b}"></span><span class="mtx"><span class="mt">${rb(x.title)}</span><span class="ms">${dKind(x)}　${BL[b]}　もう一度解く</span></span>${I('chev', 'mchev')}</button>`; }).join('')}</div>` : ''}

/* =========================================================
 * つまんで並べ替え（参考：My手帳のタグの編集）
 *   右端のつまみを押さえて上下に動かす。動かしている行は指について影が付き、
 *   またぐことになる行はその場でひとつぶん寄る。離したところで並びが決まる
 * ========================================================= */
const REORDER = {
  sort: (from, to) => { const o = state.round.cur.order; const [m] = o.splice(from, 1); o.splice(to, 0, m); drawSortList(); },
  units: (from, to) => { const [m] = U.units.splice(from, 1); U.units.splice(to, 0, m); saveU(); buildData(); render(cur(), true); }
};
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.grip'), list = h && h.closest('[data-reorder]');
  if (!list || e.button > 0) return;
  e.preventDefault();
  const rows = [...list.children], row = h.closest('[data-reorder] > *'), from = rows.indexOf(row);
  if (from < 0) return;
  const rects = rows.map(r => r.getBoundingClientRect());
  const step = from + 1 < rects.length ? rects[from + 1].top - rects[from].top : (from > 0 ? rects[from].top - rects[from - 1].top : rects[from].height);
  drag = { list, rows, row, from, to: from, y0: e.clientY, sy0: scrollY, y: e.clientY, rects, step, raf: 0 };
  try { h.setPointerCapture(e.pointerId); } catch (_) {}
  row.classList.add('lifting'); list.classList.add('reordering');
  navigator.vibrate?.(8);
  const loop = () => {   // 端に近づいたら画面を送る
    if (!drag) return;
    const edge = 72; let v = 0;
    if (drag.y < edge) v = -Math.ceil((edge - drag.y) / 6); else if (drag.y > innerHeight - edge) v = Math.ceil((drag.y - innerHeight + edge) / 6);
    if (v) { scrollBy(0, v); moveDrag(); }

  };
  drag.raf = requestAnimationFrame(loop);
});
function moveDrag(){
  const d = drag, dy = d.y - d.y0 + (scrollY - d.sy0);
  const mid = d.rects[d.from].top + d.rects[d.from].height / 2 + dy;
  let to = d.from;
  d.rects.forEach((r, k) => {
    if (k === d.from) return;
    const m = r.top + r.height / 2;
    if (k < d.from && mid < m) to = Math.min(to, k);
    if (k > d.from && mid > m) to = Math.max(to, k);
  });
  d.to = to;
  d.row.style.transform = `translateY(${dy}px)`;
  d.rows.forEach((r, k) => {
    if (k === d.from) return;
    let shift = 0;
    if (to > d.from && k > d.from && k <= to) shift = -d.step;
    if (to < d.from && k >= to && k < d.from) shift = d.step;
    r.style.transform = shift ? `translateY(${shift}px)` : '';
  });
}
document.addEventListener('pointermove', e => { if (!drag) return; drag.y = e.clientY; moveDrag(); });
function endDrag(apply){
  const d = drag; if (!d) return;
  drag = null; cancelAnimationFrame(d.raf);
  d.rows.forEach(r => { r.style.transform = ''; });
  d.row.classList.remove('lifting'); d.list.classList.remove('reordering');
  if (apply && d.to !== d.from) REORDER[d.list.dataset.reorder](d.from, d.to);
}
document.addEventListener('pointerup', () => endDrag(true));
document.addEventListener('pointercancel', () => endDrag(false));
/* キーボードでも動かせる（つまみで上下の矢印） */
document.addEventListener('keydown', e => {
  const h = e.target.closest?.('.grip'), list = h && h.closest('[data-reorder]');
  if (!list || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  const rows = [...list.children], from = rows.indexOf(h.closest('[data-reorder] > *')), to = from + (e.key === 'ArrowUp' ? -1 : 1);
  if (to < 0 || to >= rows.length) return;
  const name = list.dataset.reorder;
  REORDER[name](from, to);

/* バックアップの書き出し
 *   ホーム画面から開いたiPhoneでは <a download> が動かないため、
 *   スマホでは共有シート（「"ファイル"に保存」など）を使い、使えないときだけダウンロードにする */
async function exportBackup(){
  const data = { app: 'hoikushi-anki-note', version: 4, exportedAt: new Date().toISOString(), progress: P, db: U, goro: G };
  const json = JSON.stringify(data, null, 1);
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const name = `anki-note-backup-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`;
  const touch = matchMedia('(pointer: coarse)').matches;
  if (touch && navigator.share && navigator.canShare) {
    const file = ['application/json', 'text/plain'].map(type => new File([json], name, { type })).find(f => { try { return navigator.canShare({ files: [f] }); } catch (_) { return false; } });
    if (file) {
      try { await navigator.share({ files: [file] }); toast('書き出しました'); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }   // 閉じただけなら何もしない。それ以外の失敗はダウンロードへ
    }
  }
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
  toast('書き出しました');
}
function importBackup(file){
  const rd = new FileReader();
  rd.onload = () => {
    let data;
    try { data = JSON.parse(rd.result); } catch (_) { toast('ファイルを読み込めませんでした'); return; }
    if (!data || data.app !== 'hoikushi-anki-note' || !(data.db || data.user) || !data.progress) { toast('このアプリのバックアップではありません'); return; }
    const when = data.exportedAt ? new Date(data.exportedAt).toLocaleString('ja-JP') : '';
    confirmDialog({ title: 'バックアップから復元しますか？', body: `${when ? when + ' に書き出した' : 'この'}バックアップで、今の問題・メモ・ふりがな・学習記録を置き換えます。今の内容は消えます。`, ok: '復元する' }).then(ok => { if (!ok) return;
    P = { ...blankP(), ...data.progress }; U = data.db ? { ...blankDB(), ...data.db } : seedDB(data.user); ensureStaffUnit(U); ensureAddedUnits(U);
    delete U.media;

}

/* =========================================================
 * 検索（参考：My手帳の「探す」）
 *   ・帯を押すと条件の欄が開く。たたむと、いまの条件を短い文で帯に出す
 *   ・打っているそばから探さない。「検索する」かキーボードの検索で決める
 *   ・ひらがなで読みを打っても探せる（ふりがなの読みも対象）
 *   ・当たった語を塗り、「見つかった場所」を札の下に出す
 * ========================================================= */
const blankSearchState = () => ({ q: '', unit: '', cat: '', bucket: '' });
const FILTER_KEYS = ['unit', 'cat', 'bucket'];
const filterCount = S => FILTER_KEYS.filter(k => S[k]).length;
const searchOn = S => !!(S.q.trim() || filterCount(S));
const kataToHira = s => s.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const norm = s => kataToHira(String(s || '').normalize('NFKC').toLowerCase());
const searchWords = q => norm(q).split(/\s+/).filter(Boolean);
function readingsOf(text){
  if (!RUBY_RE) return '';
  return (String(text || '').match(RUBY_RE) || []).map(w => RUBY_MAP[w]).join(' ');
}
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function wordRe(words){
  if (!words.length) return null;
  const pat = w => [...w].map(ch => { const c = ch.charCodeAt(0); return c >= 0x3041 && c <= 0x3096 ? `[${ch}${String.fromCharCode(c + 0x60)}]` : escRe(ch); }).join('');
  return new RegExp('(' + words.slice().sort((a, b) => b.length - a.length).map(pat).join('|') + ')', 'gi');
}
/* 当たった語を塗る。漢字の語は、読みで当たったときも塗る */
function markHTML(text, words, snip){
  text = String(text || '');
  if (!words || !words.length) return rb(text);
  const re = wordRe(words);
  const readHit = w => words.some(x => norm(RUBY_MAP[w] || '').includes(x));
  if (snip && text.length > snip) {
    let idx = text.search(re);
    if (idx < 0 && RUBY_RE) { const rr = new RegExp(RUBY_RE.source, 'g'); let m; while ((m = rr.exec(text))) { if (readHit(m[0])) { idx = m.index; break; } } }
    const st = Math.max(0, (idx < 0 ? 0 : idx) - 14);
    text = (st > 0 ? '…' : '') + text.slice(st, st + snip) + (st + snip < text.length ? '…' : '');
  }
  const parts = RUBY_RE ? text.split(new RegExp('(' + RUBY_RE.source + ')', 'g')) : [text];
  /* ふりがなの語が flex/grid の箱の中でばらばらに並ばないよう、文全体を1つのまとまりにする */
  return '<span class="rtx">' + parts.map((p, i) => {
    if (i % 2 === 1) {
      const inner = SET.ruby ? furi(esc(p), esc(RUBY_MAP[p])) : esc(p);
      re.lastIndex = 0;
      return readHit(p) || re.test(p) ? `<mark class="hit">${inner}</mark>` : inner;
    }
    return p.split(re).map((s, j) => j % 2 === 1 ? `<mark class="hit">${esc(s)}</mark>` : esc(s)).join('');
  }).join('') + '</span>';
}
function hitsOf(fields, words){
  const fs = fields.filter(f => f[1]).map(([label, text]) => ({ label, text: String(text), n: norm(text) + '\n' + norm(readingsOf(text)) }));
  if (!words.every(w => fs.some(f => f.n.includes(w)))) return false;
  return fs.filter(f => words.some(w => f.n.includes(w)));
}
const fieldsOfTerm = t => [['用語', t.term], ['読み', t.kana], ['国・時代', lifeText(t)], ['要約', t.summary], ['解説', t.detail], ['問題', qList(t.q).join('\n')], ['覚え方', t.point], ['メモ', U.memos['k:' + t.key]], ['分野', t.cat]];

/* 一覧の行だけを描き直す（開く・閉じる・振り分けで、画面全体を描き直さない＝画面が動かない） */
function redrawRow(el, key){
  const li = el.closest('li.row'); if (!li) { render(cur(), true); return; }
  const [kind, id] = [key.slice(0, 1), key.slice(2)];
  let html = '';
  if (cur().v === 'list') {
    const { items, words } = listItems(), multi = !state.search.list.unit;
    const it = items.find(({ x }) => x.id === id) || { x: kind === 'q' ? qById.get(id) : kind === 'd' ? dItem(id) : eById.get(id), hits: null };
    if (!it.x) return;

  } else {

    html = kind === 'q' ? qRow(x, state.round?.origin?.unit === 'all') : kind === 'd' ? dRow(x) : eRow(x);

  if (nli) { const dy = nli.getBoundingClientRect().top - top; if (Math.abs(dy) > 1) scrollBy(0, dy); }   // 押した行が動かないように

function sheetItemsOf(D){
  const areaOf = {};
  for (const x of [...D.checks, ...D.orders]) for (const sp of (x.tbl || [])) { const k = Array.isArray(sp) ? sp[0] : sp; if (!areaOf[k]) areaOf[k] = x.area; }
  const g = a => (D.areas.find(x => x.id === a) || {}).genre || 'その他';
  const out = [
    ...((D.periods || []).length ? [{ id: '@period', unit: D.unit, genre: '早見表', title: '時期で見る（月齢・年齢ごとのまとめ）', text: D.periods.map(p => p.name + p.lines.map(l => l.join(' ')).join(' ')).join('\n'), sub: '早見表' }] : []),
    ...uniq(D.areas.map(a => a.genre)).map(gg => ({ id: '@tips:' + gg, unit: D.unit, genre: '早見表', title: `まちがえやすいポイント（${gg}）`, text: tipsOf(gg).map(x => x.t).join('\n'), sub: '早見表' }))];
  const tabs = Object.entries(D.tables).map(([k, t]) => ({ id: k, unit: D.unit, genre: g(areaOf[k] || 'dev'), title: t.title, text: [t.cols.join(' '), ...t.rows.map(r => r.join(' ')), t.note || ''].join('\n'), sub: t.cols.filter(Boolean).slice(1).join('・') }));
  const order = uniq(D.areas.map(a => a.genre));

function dictItems(){
  const S = state.search.dict, words = searchWords(S.q), tab = state.dict.tab, yr = tab === 'years';
  const out = [], { list, catOf } = scopeOf('dict');
  if (tab !== 'years' && tab !== 'tables') {
    /* 用語・人物：同じ名前は1行にまとめる。単元・分野で絞るときは、その単元の説明で出す */
    for (const M of MASTERS) {
      const mem = M.terms.filter(t => (!S.unit || t.unit === S.unit) && catMatch(t.cat, S.cat));
      if (!mem.length) continue;
      let hits = null;
      if (words.length) { hits = hitsOf(mem.flatMap(fieldsOfTerm), words); if (hits === false) continue; }
      out.push({ x: M, t: mem[0], hits });
    }
    if (words.length) out.sort((a, b) => nameRank(b.x, words) - nameRank(a.x, words));
    return { yr, tab, items: out, words, on: searchOn(S) };
  }
  const src = yr ? [...list].sort((x, y) => x.year - y.year) : list;
  for (const x of src) {
    if (S.unit && x.unit !== S.unit) continue;
    if (!catMatch(catOf(x), S.cat)) continue;
    let hits = null;
    if (words.length) { hits = hitsOf(tab === 'tables' ? [['表', x.title], ['内容', x.text]] : yr ? fieldsOfE(x) : fieldsOfTerm(x), words); if (hits === false) continue; }
    out.push({ x, hits });
  }
  return { yr, tab, items: out, words, on: searchOn(S) };
}

/* ---------- 最新バージョンに更新 ----------
 *   公開中の index.html をサーバーから直接取り、APP_VERSION を比べる。
 *   新しければ index.html と .js をすべて取り直してブラウザの保存分を入れ替え、読み込み直す。
 *   学習記録などは localStorage にあるので消えない */
let updating = false;
async function checkUpdate(btn){
  if (updating) return;
  updating = true;
  const sub = btn && btn.querySelector('.ms'), subText = sub ? sub.textContent : '';
  if (sub) sub.textContent = '確認しています…';
  try {
    const page = location.href.split('#')[0].split('?')[0];
    const res = await fetch(page, { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const m = (await res.text()).match(/const APP_VERSION = '([^']+)'/);
    if (!m) throw new Error('version not found');
    if (m[1] === APP_VERSION) { toast(`最新のバージョンです（${APP_VERSION}）`); return; }
    if (sub) sub.textContent = `${m[1]} に更新しています…`;
    const urls = [page, new URL('index.html', page).href, ...[...document.scripts].filter(s => s.src).map(s => s.src.split('#')[0])];
    await Promise.all([...new Set(urls)].map(u => fetch(u, { cache: 'reload' }).catch(() => {})));
    /* オフライン用の保存も新しい版に入れかえる */
    try { const reg = 'serviceWorker' in navigator && await navigator.serviceWorker.getRegistration(); if (reg) await reg.update(); } catch (_) {}
    persistNav();
    location.reload();
    return;
  } catch (_) {
    toast('確認できませんでした。通信状態を確かめてください');
  } finally {
    updating = false;
    if (sub && document.contains(sub) && sub.textContent.endsWith('確認しています…')) sub.textContent = subText;
  }
}

/* =========================================================

/* =========================================================

/* =========================================================
 * 覚える（カード）　1.20.0〜
 *   単元・分野ごとに、語句や人物・歴史の順番・○×の要点をまとめたカードを出す。
 *   「覚えた」「自信がない」で振り分け（P.m）、あとから「自信がない」だけを見返せる。
 *   カードの key：語句＝t:語句のkey／年号の流れ＝g:単元|時代#番号／○×＝d:セットid／職員配置＝s:施設id
 * ========================================================= */
const LB = { new: 'まだ', ok: '覚えた', unsure: '自信がない' };
const cardB = k => (P.m && P.m[k] && P.m[k].b) || 'new';
const CARD_EV_MAX = 8;

/* 年号の流れのカード：時代ごと（出来事が少ない時代は次の時代とまとめ、多い時代は8件ほどで分ける） */
function evCards(unit){
  const evs = EVENTS.filter(e => e.unit === unit).sort((a, b) => a.year - b.year);
  const groups = [];
  for (const e of evs) { const g = e.group || 'その他'; let G = groups.find(x => x.g === g); if (!G) groups.push(G = { g, evs: [] }); G.evs.push(e); }
  const merged = []; let buf = null;
  for (const G of groups) {
    if (!buf) buf = { gs: [G.g], evs: [...G.evs] }; else { buf.gs.push(G.g); buf.evs.push(...G.evs); }
    if (buf.evs.length >= 3) { merged.push(buf); buf = null; }
  }
  if (buf) { if (merged.length) { const L = merged[merged.length - 1]; L.gs.push(...buf.gs); L.evs.push(...buf.evs); } else merged.push(buf); }
  const out = [];
  for (const M of merged) {
    const n = Math.ceil(M.evs.length / CARD_EV_MAX), size = Math.ceil(M.evs.length / n), name = M.gs.join('・');
    for (let i = 0; i < n; i++) {
      const part = M.evs.slice(i * size, (i + 1) * size); if (!part.length) continue;
      out.push({ key: `g:${unit}|${M.gs.join('+')}#${i}`, unit, genre: '年号', sub: name, kind: 'ev', title: `${name}の流れ${n > 1 ? `（${i + 1}/${n}）` : ''}`, ids: part.map(e => e.id) });
    }
  }
  return out;
}
const staffGenre = unit => catsFor('quiz', unit).includes('施設') ? '施設' : '職員配置';
function cardsOf(unit){
  if (unit === 'all') return UNITS.flatMap(u => cardsOf(u.id));
  if (!unitById.has(unit)) return [];
  const out = [];
  for (const t of TERMS) if (t.unit === unit && t.summary) out.push({ key: 't:' + t.key, unit, genre: genreOf(t.cat), sub: subOf(t.cat), kind: 'term', title: isLatency(t) ? t.summary.replace(/。$/, '') : t.term, ref: t.key });
  out.push(...evCards(unit));
  for (const x of devOf(unit)) out.push({ key: 'd:' + x.id, unit, genre: devGenre(x), sub: devAreaTitle(x), kind: 'dev', title: x.title, ref: x.id });
  const sg = staffGenre(unit);
  for (const f of staffOf(unit)) out.push({ key: 's:' + f.id, unit, genre: sg, sub: '職員配置', kind: 'staff', title: sFacName(f), ref: f.id });
  return out;
}
let _cardIdx = null;
const cardByKey = k => { if (!_cardIdx) _cardIdx = new Map(cardsOf('all').map(c => [c.key, c])); return _cardIdx.get(k) || null; };
/* 分野の並び：問題の分野の順にそろえ、年号・職員配置はあとに */
function learnGenres(unit, cards){
  const base = catsFor('quiz', unit), gs = uniq(cards.map(c => c.genre));
  return [...base.filter(g => gs.includes(g)), ...gs.filter(g => !base.includes(g))];
}
function cardCount(cards){ const c = { new: 0, ok: 0, unsure: 0, total: cards.length }; for (const x of cards) c[cardB(x.key)]++; return c; }
const cardBar = c => `<span class="pbar sm">${c.ok ? `<i class="p-ok" style="flex:${c.ok}"></i>` : ''}${c.unsure ? `<i class="p-uns" style="flex:${c.unsure}"></i>` : ''}${c.new ? `<i class="p-new" style="flex:${c.new}"></i>` : ''}</span>`;

}
/* 単元ページの「覚える」 */
function learnSection(id){

    return `<button class="mrow urow" data-act="learnGo" data-v="${esc(r.v)}" ${n ? '' : 'aria-disabled="true"'}><span class="mi">${I(r.icon)}</span><span class="mtx"><span class="mt">${esc(r.title)}<span class="upct">${x.total ? Math.floor(x.ok / x.total * 100) : 0}%</span></span><span class="ms">${kinds}　覚えた ${x.ok}／${x.total}${x.unsure ? `　自信がない ${x.unsure}` : ''}</span><span class="mbar">${cardBar(x)}</span></span>${I('chev', 'mchev')}</button>`; };
  const fb = (v, l, n) => `<button data-act="lfilter" data-v="${v}" aria-pressed="${L.filter === v}">${l}${n != null ? `<span class="segn">${n}</span>` : ''}</button>`;

const PAD_W = 800, PAD_H = 560;

  const dpr = Math.min(3, window.devicePixelRatio || 1), W = Math.round(w * dpr), H = Math.round(w * PAD_H / PAD_W * dpr);

function padAction(act, v){

document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.matches && t.matches('textarea.ta:not(.big)') && !ev.isComposing) autoGrow(t);   // 変換中は高さを変えない（予測変換を妨げないように）
  if (t.id === 'dtq') { const D = dtState(); D.q = t.value; D.pick = false; clearTimeout(sqTimer); sqTimer = setTimeout(redrawDt, 200); return; }
  if (t.id === 'sq-dm') { dmState().q = t.value; clearTimeout(sqTimer); sqTimer = setTimeout(drawDm, 200); return; }
  if (t.id === 'sq-list' || t.id === 'sq-dict') {   // 打つそばから絞る（少し待ってから）
    const ctx = t.id.slice(3); state.search[ctx].q = t.value;
    clearTimeout(sqTimer); sqTimer = setTimeout(() => { state.opened.clear(); ctx === 'list' ? drawList() : drawDict(); persistNav(); }, 220);
  }
  else if (t.id === 'mineQ') { state.mine.q = t.value; drawMine(); }
  else if (t.id === 'rubyQ') { state.ruby.q = t.value; drawRuby(); }
  else if (t.id === 'rbWord' || t.id === 'rbRead') {
    const w = document.getElementById('rbWord').value.trim(), r = document.getElementById('rbRead').value.trim();
    document.getElementById('rbPv').innerHTML = w ? (r ? furi(esc(w), esc(r)) : esc(w)) : '<span class="muted">ここに見え方が出ます</span>';
  }
  else if (t.id === 'bulkText') { state.bulk.text = t.value; onBulkInput(); }
  else if (t.id === 'bulkNew') state.bulk.newName = t.value;
  else if (t.id === 'impNew') state.imp.newName = t.value;
  else if (t.id === 'newUnit') { const b = document.getElementById('unitCreateBtn'); if (b) b.disabled = !t.value.trim(); }
  else if (t.id === 'oneNew') state.one.newName = t.value;
  else if (t.closest('#oneForm') && t.dataset.f && t.dataset.f !== 'unit') state.one.f[t.dataset.f] = t.value;
});
document.addEventListener('compositionend', ev => {   // 変換が確定してから高さを合わせる
  const t = ev.target;
  if (t.matches && t.matches('textarea.ta:not(.big)')) autoGrow(t);
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (cur().v === 'setup' && ['sDir', 'sForm', 'sCat', 'sCount', 'sSets', 'sSize'].includes(t.id)) {
    const S = state.setup, kind = cur().a, unit = cur().u, v = t.value;
    if (t.id === 'sDir') S.dir = v;
    if (t.id === 'sForm') S.form = v;
    if (t.id === 'sCat') { const cs = catsFor(kind, unit); state.setup.cats[`${unit}|${kind}`] = new Set(v ? [v] : cs); }
    if (t.id === 'sCount') S.count = v === 'all' ? 'all' : +v;
    if (t.id === 'sSets') S.sets = +v;
    if (t.id === 'sSize') S.size = +v;
    render(cur(), true); return;
  }
  if (t.id === 'lkind') { state.list.kind = t.value; state.search.list.cat = ''; state.search.list.bucket = ''; state.opened.clear(); render(cur(), true); return; }
  if (t.id === 'dtab') { state.dict.tab = t.value; state.search.dict.cat = ''; render(cur(), true); return; }
  if (t.id === 'fUnit' && document.getElementById('fCat')) {
    const ctx = t.closest('form')?.dataset.ctx || 'dict', { list, catOf } = scopeOf(ctx), sel = document.getElementById('fCat');
    const cats = uniq(list.filter(x => !t.value || x.unit === t.value).map(catOf)).filter(Boolean);
    sel.innerHTML = `<option value="">${sel.options[0] ? esc(sel.options[0].textContent) : 'すべて'}</option>` + catOptions(cats, '');
    return;
  }
  if (t.id === 'impUnit') { state.imp.unit = t.value; state.imp.items.forEach(x => { if (!x.unitPreset && !x.unitName) x.sel = !impDup(x); }); render(cur(), true); }
  else if (t.dataset && t.dataset.imp != null) { const it = state.imp.items[+t.dataset.imp]; it.sel = t.checked; render(cur(), true); }
  else if (t.id === 'oneUnit') { state.one.unit = t.value; render(cur(), true); }
  else if (t.id === 'importFile' && t.files[0]) { importBackup(t.files[0]); t.value = ''; }
  else if (t.id === 'bulkFile' && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { state.bulk.text = (state.bulk.text ? state.bulk.text.trim() + '\n---\n' : '') + String(rd.result); state.bulk.done = null; render(cur(), true); toast('読み込みました'); };
    rd.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('keydown', ev => {
  if (document.querySelector('.dlg')) return;
  if (ev.key === 'Escape') { if (tipEl) { hideTip(); return; } if (modalOpen()) { requestCloseModal(); return; } }
  if (ev.key === 'Enter' && (ev.target.id === 'sq-list' || ev.target.id === 'sq-dict' || ev.target.id === 'sq-dm') && !ev.isComposing) { ev.preventDefault(); ev.target.blur(); return; }
  if (ev.key === 'Enter' && ev.target.id === 'newUnit' && !ev.isComposing) { ev.preventDefault(); createUnit(); return; }
  if (cur().v === 'cards' && state.deck && !modalOpen() && !/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) {
    if (ev.key === ' ' && SET.cardHide && !state.deck.rev && state.deck.i < state.deck.keys.length) { ev.preventDefault(); state.deck.rev = true; renderDeck(); }
    else if (ev.key === 'ArrowRight' || ev.key === '2') { if (state.deck.i < state.deck.keys.length) { ev.preventDefault(); cardMark('ok'); } }
    else if (ev.key === '1') { if (state.deck.i < state.deck.keys.length) { ev.preventDefault(); cardMark('unsure'); } }
    else if (ev.key === 'ArrowLeft') { ev.preventDefault(); deckStep(-1); }
    return;
  }
  const r = state.round;
  if (cur().v !== 'round' || !r || !r.cur || /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName) || modalOpen()) return;
  if (r.cur.type === 'quiz' && r.cur.picked === null && /^[1-4]$/.test(ev.key)) { choose(+ev.key - 1); ev.preventDefault(); }
  else if (r.cur.type === 'quiz' && r.cur.picked === null && (ev.key === '0' || ev.key === '?')) { choose(-1); ev.preventDefault(); }
});

clearSession();
buildData();
let scrollSave = null;
addEventListener('scroll', () => { clearTimeout(scrollSave); scrollSave = setTimeout(persistNav, 300); }, { passive: true });
addEventListener('pagehide', persistNav);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persistNav(); });
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
if (!restoreNav()) go({ v: 'home' }, 'tab');
/* オフラインで使えるように、アプリのファイルを端末に保存する（sw.js）。Webで公開しているときだけ */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
})();

</script>
</body>
