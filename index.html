/* =========================================================
 * つまんで並べ替え（参考：My手帳のタグの編集）
 *   右端のつまみを押さえて上下に動かす。動かしている行は指について影が付き、
 *   またぐことになる行はその場でひとつぶん寄る。離したところで並びが決まる
 * ========================================================= */
const REORDER = {
  sort: (from, to) => { const o = state.round.cur.order; const [m] = o.splice(from, 1); o.splice(to, 0, m); drawSortList(); },
  units: (from, to) => { const [m] = U.units.splice(from, 1); U.units.splice(to, 0, m); saveU(); buildData(); render(cur(), true); }
};
let drag = null;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('.grip'), list = h && h.closest('[data-reorder]');
  if (!list || e.button > 0) return;
  e.preventDefault();
  const rows = [...list.children], row = h.closest('[data-reorder] > *'), from = rows.indexOf(row);
  if (from < 0) return;
  const rects = rows.map(r => r.getBoundingClientRect());
  const step = from + 1 < rects.length ? rects[from + 1].top - rects[from].top : (from > 0 ? rects[from].top - rects[from - 1].top : rects[from].height);
  drag = { list, rows, row, from, to: from, y0: e.clientY, sy0: scrollY, y: e.clientY, rects, step, raf: 0 };
  try { h.setPointerCapture(e.pointerId); } catch (_) {}
  row.classList.add('lifting'); list.classList.add('reordering');
  navigator.vibrate?.(8);
  const loop = () => {   // 端に近づいたら画面を送る
    if (!drag) return;
    const edge = 72; let v = 0;
    if (drag.y < edge) v = -Math.ceil((edge - drag.y) / 6); else if (drag.y > innerHeight - edge) v = Math.ceil((drag.y - innerHeight + edge) / 6);
    if (v) { scrollBy(0, v); moveDrag(); }
    drag.raf = requestAnimationFrame(loop);
  };
  drag.raf = requestAnimationFrame(loop);
});
function moveDrag(){
  const d = drag, dy = d.y - d.y0 + (scrollY - d.sy0);
  const mid = d.rects[d.from].top + d.rects[d.from].height / 2 + dy;
  let to = d.from;
  d.rects.forEach((r, k) => {
    if (k === d.from) return;
    const m = r.top + r.height / 2;
    if (k < d.from && mid < m) to = Math.min(to, k);
    if (k > d.from && mid > m) to = Math.max(to, k);
  });
  d.to = to;
  d.row.style.transform = `translateY(${dy}px)`;
  d.rows.forEach((r, k) => {
    if (k === d.from) return;
    let shift = 0;
    if (to > d.from && k > d.from && k <= to) shift = -d.step;
    if (to < d.from && k >= to && k < d.from) shift = d.step;
    r.style.transform = shift ? `translateY(${shift}px)` : '';
  });
}
document.addEventListener('pointermove', e => { if (!drag) return; drag.y = e.clientY; moveDrag(); });
function endDrag(apply){
  const d = drag; if (!d) return;
  drag = null; cancelAnimationFrame(d.raf);
  d.rows.forEach(r => { r.style.transform = ''; });
  d.row.classList.remove('lifting'); d.list.classList.remove('reordering');
  if (apply && d.to !== d.from) REORDER[d.list.dataset.reorder](d.from, d.to);
}
document.addEventListener('pointerup', () => endDrag(true));
document.addEventListener('pointercancel', () => endDrag(false));
/* キーボードでも動かせる（つまみで上下の矢印） */
document.addEventListener('keydown', e => {
  const h = e.target.closest?.('.grip'), list = h && h.closest('[data-reorder]');
  if (!list || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  const rows = [...list.children], from = rows.indexOf(h.closest('[data-reorder] > *')), to = from + (e.key === 'ArrowUp' ? -1 : 1);
  if (to < 0 || to >= rows.length) return;
  const name = list.dataset.reorder;
  REORDER[name](from, to);
  document.querySelectorAll(`[data-reorder="${name}"] > *`)[to]?.querySelector('.grip')?.focus();
});

const blankSearchState = () => ({ q: '', unit: '', cat: '', bucket: '' });

function markHTML(text, words, snip){
  text = String(text || '');
  if (!words || !words.length) return rb(text);
  const re = wordRe(words);
  const readHit = w => words.some(x => norm(RUBY_MAP[w] || '').includes(x));
  if (snip && text.length > snip) {
    let idx = text.search(re);
    if (idx < 0 && RUBY_RE) { const rr = new RegExp(RUBY_RE.source, 'g'); let m; while ((m = rr.exec(text))) { if (readHit(m[0])) { idx = m.index; break; } } }
    const st = Math.max(0, (idx < 0 ? 0 : idx) - 14);
    text = (st > 0 ? '…' : '') + text.slice(st, st + snip) + (st + snip < text.length ? '…' : '');

      re.lastIndex = 0;

  let rows = `<label class="frow"><span>単元</span><select class="sel" id="fUnit">${opt('', 'すべての単元', S.unit)}${units.map(u => opt(u, unitName(u), S.unit)).join('')}</select></label>`;
  if (ctx === 'dict') rows += `<label class="frow"><span>${yr ? '時代' : '分野'}</span><select class="sel" id="fCat">${opt('', yr ? 'すべての時代' : 'すべての分野', S.cat)}${catList(S.unit).map(c => opt(c, c, S.cat)).join('')}</select></label>`;
  else {
    const k = isQ ? 'q' : 'e', scope = (isQ ? QUESTIONS.filter(q => state.list.kind === 'rev' ? q.type === 'rev' : q.type !== 'rev') : EVENTS).filter(x => !S.unit || x.unit === S.unit), c = countB(k, scope);

  }
  openModal(`<h2 class="sheet-t">絞り込み</h2>
    <form id="filterForm" data-ctx="${ctx}"><div class="flist">${rows}</div>
      <div class="sheet-actions"><div class="two"><button type="button" class="btn" data-act="fClear" data-v="${ctx}">条件をクリア</button><button type="submit" class="btn primary">この条件で表示</button></div></div></form>`, { noFocus: true });
  openFilterSheet.catList = catList;
}

/* 一覧の行だけを描き直す（開く・閉じる・振り分けで、画面全体を描き直さない＝画面が動かない） */
function redrawRow(el, key){
  const li = el.closest('li.row'); if (!li) { render(cur(), true); return; }
  const [kind, id] = [key.slice(0, 1), key.slice(2)];
  let html = '';
  if (cur().v === 'list') {
    const { items, words } = listItems(), multi = !state.search.list.unit;
    const it = items.find(({ x }) => x.id === id) || { x: kind === 'q' ? qById.get(id) : eById.get(id), hits: null };
    if (!it.x) return;
    html = kind === 'q' ? qRow(it.x, multi, it.hits, words) : eRow(it.x, it.hits, words);
  } else {
    const x = kind === 'q' ? qById.get(id) : eById.get(id); if (!x) return;
    html = kind === 'q' ? qRow(x, state.round?.origin?.unit === 'all') : eRow(x);
  }
  const top = li.getBoundingClientRect().top;
  li.outerHTML = html;
  const nli = [...app.querySelectorAll('li.row')].find(r => r.querySelector(`[data-v="${CSS.escape(key)}"]`));
  if (nli) { const dy = nli.getBoundingClientRect().top - top; if (Math.abs(dy) > 1) scrollBy(0, dy); }   // 押した行が動かないように
  nli?.querySelectorAll('textarea.ta:not(.big)').forEach(autoGrow);
}
function listItems(){
  const L = state.list, S = state.search.list, isQ = L.kind !== 'sort', k = isQ ? 'q' : 'e';
  const words = searchWords(S.q);
  const scoped = (isQ ? QUESTIONS.filter(q => L.kind === 'rev' ? q.type === 'rev' : q.type !== 'rev') : EVENTS).filter(x => !S.unit || x.unit === S.unit);
  const items = [];
  for (const x of scoped) {
    if (S.bucket && bucket(k, x.id) !== S.bucket) continue;
    let hits = null;
    if (words.length) { hits = hitsOf(isQ ? fieldsOfQ(x) : fieldsOfE(x), words); if (hits === false) continue; }
    items.push({ x, hits });
  }
  return { isQ, k, items, words, on: searchOn(S) };
}

 *   標準（ruby.js）・用語の読み・自分で追加 をすべて一覧に出し、

function rubyEntries(){ return Object.entries(U.ruby || {}).filter(([, r]) => r).map(([word, reading]) => ({ word, reading })); }
const KANA_ROWS = ['あいうえおぁぃぅぇぉゔ', 'かきくけこ', 'さしすせそ', 'たちつてとっ', 'なにぬねの', 'はひふへほ', 'まみむめも', 'やゆよゃゅょ', 'らりるれろ', 'わをんゎ'];
const KANA_HEAD = ['あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ'];
function kanaRow(s){
  const c = kataToHira(String(s || '').charAt(0)).normalize('NFD').charAt(0);
  const i = KANA_ROWS.findIndex(r => r.includes(c));
  return i < 0 ? 'ほか' : KANA_HEAD[i] + '行';
}
function renderRuby(){
  app.innerHTML = `
  <div class="headact"><h1 class="ptitle">ふりがなの辞書 ${help('ruby')}</h1><button class="btn primary sm" data-act="rubyAdd">${I('plus')}追加</button></div>

  <div style="margin-top:14px">${listSearch('rubyQ', state.ruby.q, '語・読みで探す')}</div>
  <div id="rubyList"></div>`;
  drawRuby();
}
function drawRuby(){
  const words = searchWords(state.ruby.q);
  let list = rubyEntries();
  if (words.length) list = list.filter(x => { const s = norm(x.word + ' ' + x.reading); return words.every(w => s.includes(w)); });
  list.sort((a, b) => a.reading.localeCompare(b.reading, 'ja'));
  const box = document.getElementById('rubyList');
  if (!list.length) { box.innerHTML = `<p class="empty">${words.length ? '見つかりません' : 'まだありません。「追加」から登録できます'}</p>`; return; }
  let html = '', head = null, open = false;
  for (const x of list) {
    const h = kanaRow(x.reading);
    if (h !== head) { if (open) html += '</div>'; html += `<h2 class="rgroup">${h}</h2><div class="menu">`; head = h; open = true; }
    html += `<button class="rrow" data-act="rubyEdit" data-v="${esc(x.word)}"><span class="rw"><ruby>${esc(x.word)}<rt>${esc(x.reading)}</rt></ruby></span><span class="rr">${markHTML(x.reading, words)}</span>${I('chev', 'mchev')}</button>`;
  }
  box.innerHTML = html + (open ? '</div>' : '');
}
function openRubySheet(word){

function saveRubyForm(form){
  const orig = form.dataset.word, word = form.querySelector('#rbWord').value.trim(), reading = form.querySelector('#rbRead').value.trim().replace(/\s+/g, '');

  U.ruby[word] = reading;

}

  <h1 class="ptitle">単元 ${help('units')}</h1>
  <div class="addrow"><input class="inp" id="newUnit" placeholder="新しい単元" autocomplete="off" enterkeyhint="done"><button class="btn primary" data-act="unitCreate" id="unitCreateBtn" disabled>${I('plus')}作る</button></div>
  ${UNITS.length ? `<ul class="dlist" data-reorder="units">${UNITS.map(row).join('')}</ul>` : '<p class="empty">まだ単元がありません</p>'}`;
}
function openUnitSheet(id){
  const u = U.units.find(x => x.id === id);
  if (!u) return;
  const icon = u.icon || 'book', i = U.units.indexOf(u);
  openModal(`
    <h2 class="sheet-t">単元の設定</h2>
    <form id="unitForm" data-guard data-id="${esc(id)}">
      ${fld('名前', 'name', u.name || '', 'inp', true)}
      ${fld('説明', 'desc', u.desc || '', 'inp')}
      <div class="fld"><label>アイコン</label><div class="chips">${UNIT_ICONS.map(ic => `<label class="iconpick"><input type="radio" name="icon" data-f="icon" value="${ic}" ${ic === icon ? 'checked' : ''}><span>${I(ic)}</span></label>`).join('')}</div></div>
      <div class="sheet-actions"><div class="two"><button type="button" class="btn" data-act="closeModal">キャンセル</button><button type="submit" class="btn primary">保存する</button></div>
        <div class="sheet-sub">
          ${i > 0 ? `<button type="button" class="textbtn" data-act="unitTop" data-v="${esc(id)}">${I('up')}いちばん上へ</button>` : ''}
          <button type="button" class="textbtn danger" data-act="unitDel" data-v="${esc(u.id)}">この単元を削除</button>
        </div></div>
    </form>`, { noFocus: true });
}
function saveUnitForm(form){
  const name = form.querySelector('#f_name').value.trim(), desc = form.querySelector('#f_desc').value.trim();
  const icon = form.querySelector('input[name=icon]:checked')?.value || 'book';
  if (!name) { toast('名前を入力してください'); return; }
  if (U.units.some(u => u.name === name && u.id !== form.dataset.id)) { toast('同じ名前の単元があります'); return; }
  Object.assign(U.units.find(x => x.id === form.dataset.id), { name, desc, icon });
  saveU(); buildData(); closeModal(); render(cur(), true); toast('保存しました');
}
function createUnit(){
  const inp = document.getElementById('newUnit'), name = (inp?.value || '').trim();
  if (!name) return;
  if (U.units.some(u => u.name === name)) { toast('同じ名前の単元があります'); return; }
  U.units.push({ id: 'u' + uid(), name, desc: '', icon: 'book' });
  saveU(); buildData(); render(cur(), true); toast(`「${name}」を作りました`);
}

/* =========================================================
 * 操作
 * ========================================================= */
async function onAction(el, ev){
  const act = el.dataset.act, v = el.dataset.v, S = state.setup;
  switch (act) {
    case 'tab': tabTap(v); break;
    case 'back': uiBack(); break;
    case 'help': showTip(el, v); break;
    case 'goUnit': go({ v: 'unit', a: v }); break;
    case 'unitList':
      state.list.kind = QUESTIONS.some(q => q.unit === state.unit) ? 'quiz' : 'sort';
      state.search.list = { ...blankSearchState(), unit: state.unit !== 'all' ? state.unit : '' };
      state.opened.clear(); go({ v: 'list' }, 'tab'); break;
    case 'unitDict': {
      const hasT = TERMS.some(t => state.unit === 'all' || t.unit === state.unit);
      state.dict.tab = hasT ? 'terms' : 'years';
      state.search.dict = { ...blankSearchState(), unit: state.unit !== 'all' && hasT ? state.unit : '' };
      go({ v: 'dict' }, 'tab'); break;
    }
    case 'unitAdd': state.bulk.unit = state.unit; state.bulk.done = null; go({ v: 'bulk' }); break;
    case 'setupQuiz': go({ v: 'setup', a: 'quiz', u: state.unit }); break;
    case 'setupSort': go({ v: 'setup', a: 'sort', u: state.unit }); break;
    case 'quickReview': quickReview(); break;
    case 'sbucket': { const k = cur().a, B = S.buckets[k]; B.has(v) ? B.delete(v) : B.add(v); render(cur(), true); break; }
    case 'sall': S.buckets[cur().a] = new Set(ORDER); render(cur(), true); break;
    case 'sreview': S.buckets[cur().a] = new Set(WEAK); render(cur(), true); break;
    case 'scat': { const s = selectedCats(cur().a, cur().u); s.has(v) ? s.delete(v) : s.add(v); render(cur(), true); break; }
    case 'scount': S.count = v === 'all' ? 'all' : +v; render(cur(), true); break;
    case 'sdir': S.dir = v; render(cur(), true); break;
    case 'ssets': S.sets = +v; render(cur(), true); break;
    case 'ssize': S.size = +v; render(cur(), true); break;
    case 'startSetup': startFromSetup(); break;
    case 'choose': choose(+v); break;
    case 'dontknow': choose(-1); break;
    case 'submitSort': submitSort(); break;
    case 'sortDontKnow': sortDontKnow(); break;
    case 'next': next(); break;
    case 'classify':
      setBucket(el.dataset.k, el.dataset.id, v);
      if (cur().v === 'round') el.closest('.seg3').outerHTML = classifySeg(el.dataset.k, el.dataset.id, el.dataset.new === '1');
      else if (el.closest('li.row')) redrawRow(el, (el.dataset.k === 'q' ? 'q:' : 'e:') + el.dataset.id);
      else render(cur(), true);
      toast(`「${BL[v]}」に振り分けました`);
      break;
    case 'open': state.opened.has(v) ? state.opened.delete(v) : state.opened.add(v); redrawRow(el, v); break;
    case 'retryReview': retry('review'); break;
    case 'retryAll': retry('all'); break;
    case 'setupAgain': {
      const o = state.round.origin, prev = stack[stack.length - 2];
      if (prev && prev.v === 'setup') uiBack(); else go({ v: 'setup', a: o.kind === 'sort' ? 'sort' : 'quiz', u: o.unit }, 'replace');
      break;
    }
    case 'resume': resumeSession(); break;
    case 'discardSession':
      if (await confirmDialog({ title: '中断中の問題を破棄しますか？', body: 'ここまでの振り分けは残ります。', ok: '破棄する' })) { clearSession(); render(cur(), true); toast('破棄しました'); }
      break;

    /* 検索 */
    case 'sFilter': openFilterSheet(v); break;
    case 'sDrop': { const S = state.search[el.dataset.c]; S[el.dataset.k] = ''; if (el.dataset.k === 'unit') S.cat = ''; state.opened.clear(); render(cur(), true); break; }
    case 'fClear': { const S = state.search[v]; FILTER_KEYS.forEach(k => { S[k] = ''; }); closeModal(); state.opened.clear(); render(cur(), true); break; }
    case 'lsClear': {
      const inp = document.getElementById(v); if (!inp) break;
      inp.value = ''; inp.dispatchEvent(new Event('input', { bubbles: true })); inp.focus();
      break;
    }

    /* 振り分け・図鑑 */
    case 'listStart': listStart(); break;
    case 'resetList': {
      const { k, items } = listItems();
      if (await confirmDialog({ title: `${items.length}件を未回答に戻しますか？`, body: '表示中の問題の振り分けを「未回答」に戻します。問題や編集・メモは消えません。', ok: '未回答に戻す' })) {
        items.forEach(({ x }) => delete P[k][x.id]); saveP(); state.opened.clear(); render(cur(), true); toast('未回答に戻しました');
      }
      break;
    }
    case 'term': openTerm(v); break;
    case 'closeModal': requestCloseModal(); break;

    /* 編集・削除 */
    case 'editQ': { const q = qById.get(v); if (!q) break; q.termKey ? openEditTerm(q.termKey) : openEditEvent(q.eventId); break; }
    case 'editT': openEditTerm(v); break;
    case 'editE': openEditEvent(v); break;
    case 'delTerm': {
      const t = termByKey.get(v);
      if (!await confirmDialog({ title: '問題を削除しますか？', body: `「${t ? t.term : ''}」を削除します。メモと振り分けも消え、元に戻せません。` })) break;
      U.terms = U.terms.filter(x => x.key !== v); delete U.memos['k:' + v];
      saveU(); buildData(); afterDataChange(); toast('削除しました'); break;
    }
    case 'delEvent': {
      const e = eById.get(v);
      if (!await confirmDialog({ title: '出来事を削除しますか？', body: `「${e ? e.title : ''}」を削除します。メモと振り分けも消え、元に戻せません。` })) break;
      U.events = U.events.filter(x => x.id !== v); delete U.memos['e:' + v];
      saveU(); buildData(); afterDataChange(); toast('削除しました'); break;
    }
    case 'delMemo': {
      if (!await confirmDialog({ title: 'メモを削除しますか？', body: 'このメモを削除します。元に戻せません。' })) break;
      delete U.memos[v]; saveU(); afterDataChange(); toast('メモを削除しました'); break;
    }

    /* データ */
    case 'goBulk': state.bulk.done = null; go({ v: 'bulk' }); break;
    case 'goOne': go({ v: 'one' }); break;
    case 'goMine': go({ v: 'mine' }); break;
    case 'goRuby': go({ v: 'ruby' }); break;
    case 'goUnits': go({ v: 'units' }); break;
    case 'copyTpl': copyTemplate(); break;
    case 'bulkClear':
      if (!state.bulk.text.trim()) break;
      if (await confirmDialog({ title: '入力した内容を消しますか？', ok: '消す' })) { state.bulk.text = ''; state.bulk.done = null; render(cur(), true); }
      break;
    case 'bulkCheck': {
      const { items, errors } = parseText(state.bulk.text);
      if (items.length) startImport(items, 'text', errors);
      break;
    }
    case 'importBundle': {
      const items = bundleCandidates();
      if (!items.length) { toast('付属の問題はすべて取り込まれています'); break; }
      startImport(items, 'bundle');
      break;
    }
    case 'impEdit': openImpSheet(+v); break;
    case 'impAll': state.imp.items.forEach(x => { x.sel = true; }); render(cur(), true); break;
    case 'impNone': state.imp.items.forEach(x => { x.sel = false; }); render(cur(), true); break;
    case 'impRemove':
      if (await confirmDialog({ title: 'この項目を外しますか？', body: '取り込む一覧から外します。元のテキストは消えません。', ok: '外す' })) { state.imp.items.splice(+v, 1); closeModal(); if (!state.imp.items.length) uiBack(); else render(cur(), true); }
      break;
    case 'impCommit': {
      const I0 = state.imp, chosen = I0.items.filter(x => x.sel);
      if (!chosen.length) break;
      if (I0.unit === '__new' && chosen.some(x => !x.unitPreset && !x.unitName) && !I0.newName.trim()) { toast('新しい単元の名前を入力してください'); document.getElementById('impNew')?.focus(); break; }
      if (!await confirmDialog({ title: `${chosen.length}件を取り込みますか？`, body: I0.items.length > chosen.length ? `チェックを外した${I0.items.length - chosen.length}件は取り込みません。` : '', ok: '取り込む', danger: false })) break;
      if (I0.source === 'bundle') for (const [k, r] of Object.entries(window.RUBY || {})) if (!(k in U.ruby)) U.ruby[k] = r;
      const r = addItems(chosen.map(({ sel, ...x }) => x), I0.unit, I0.newName);
      if (I0.source === 'text') state.bulk = { unit: r.unit, newName: '', text: '', done: null };
      state.imp = null;
      toast(`${r.added}件を取り込みました${r.skipped ? `（同じもの${r.skipped}件は除きました）` : ''}`);
      if (I0.source === 'text' && r.unit && r.unit !== '__new') go({ v: 'unit', a: r.unit }, 'tab'); else go({ v: 'home' }, 'tab');
      break;
    }
    case 'unitCreate': createUnit(); break;
    case 'unitTop': { const i = U.units.findIndex(u => u.id === v); if (i > 0) { const [m] = U.units.splice(i, 1); U.units.unshift(m); saveU(); buildData(); } closeModal(); render(cur(), true); toast('いちばん上へ移しました'); break; }
    case 'wipeAll': {
      if (!await confirmDialog({ title: '問題をすべて削除しますか？', body: `単元${UNITS.length}・用語${TERMS.length}件・出来事${EVENTS.length}件・メモをすべて削除し、空の状態にします。ふりがなの辞書と学習記録は残ります。元に戻せません。\n付属の問題は「付属の問題ファイルから取り込む」でもう一度入れられます。`, ok: 'すべて削除' })) break;
      U.units = []; U.terms = []; U.events = []; U.memos = {}; saveU(); buildData(); clearSession(); render(cur(), true); toast('すべて削除しました'); break;
    }
    case 'oneKind': state.one.kind = v; render(cur(), true); break;
    case 'exportBackup': exportBackup(); break;
    case 'toggleSound': SET.sound = !SET.sound; saveSet(); if (SET.sound) { SFX.unlock(); SFX.correct(); } if (cur().v === 'round') renderTop(); else render(cur(), true); toast(`効果音を${SET.sound ? 'オン' : 'オフ'}にしました`); break;
    case 'toggleRuby': SET.ruby = !SET.ruby; saveSet(); render(cur(), true); break;
    case 'resetAll':
      if (await confirmDialog({ title: '学習記録をすべてリセットしますか？', body: 'すべての問題の振り分けが「未回答」に戻ります。編集・メモ・追加した問題・ふりがなは残ります。元に戻せません。', ok: 'リセットする' })) { P = blankP(); saveP(); clearSession(); render(cur(), true); toast('リセットしました'); }
      break;

    /* ふりがなの辞書 */
    case 'rubyAdd': openRubySheet(null); break;
    case 'rubyEdit': openRubySheet(v); break;
    case 'rubyDel':
      if (await confirmDialog({ title: 'ふりがなを削除しますか？', body: `「${v}」のふりがなを削除します。` })) { delete U.ruby[v]; saveU(); buildRuby(); closeModal(); render(cur(), true); toast('削除しました'); }
      break;
    case 'unitEdit': openUnitSheet(v); break;
    case 'unitDel': {
      const u = U.units.find(x => x.id === v); if (!u) break;
      const nt = U.terms.filter(t => t.unit === v).length, ne = U.events.filter(e => e.unit === v).length;
      if (!await confirmDialog({ title: `「${u.name}」を削除しますか？`, body: `この単元と、中の用語・問題${nt}件、出来事${ne}件を削除します。元に戻せません。` })) break;
      U.terms.filter(t => t.unit === v).forEach(t => delete U.memos['k:' + t.key]);
      U.events.filter(e => e.unit === v).forEach(e => delete U.memos['e:' + e.id]);
      U.units = U.units.filter(x => x.id !== v); U.terms = U.terms.filter(t => t.unit !== v); U.events = U.events.filter(e => e.unit !== v);
      saveU(); buildData(); closeModal();
      if (stack.some(r => r.v === 'unit' && r.a === v)) go({ v: 'data' }, 'tab'); else render(cur(), true);
      toast('削除しました'); break;
    }
  }
}
document.addEventListener('click', ev => {
  SFX.unlock();
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  onAction(el, ev);
});
document.addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === 'editForm') { if (saveEdit(f)) { afterDataChange(); toast('保存しました'); } }
  else if (f.id === 'oneForm') submitOne();
  else if (f.id === 'rubyForm') saveRubyForm(f);
  else if (f.id === 'unitForm') saveUnitForm(f);
  else if (f.id === 'impForm') saveImpForm(f);
  else if (f.id === 'filterForm') {
    const S = state.search[f.dataset.ctx];
    S.unit = f.querySelector('#fUnit')?.value || '';
    S.cat = f.querySelector('#fCat')?.value || '';
    S.bucket = f.querySelector('#fBucket')?.value || '';
    closeModal(); state.opened.clear(); render(cur(), true); scrollTo(0, 0);
  }
});
let sqTimer = null;
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.matches && t.matches('textarea.ta:not(.big)')) autoGrow(t);
  if (t.id === 'sq-list' || t.id === 'sq-dict') {   // 打つそばから絞る（少し待ってから）
    const ctx = t.id.slice(3); state.search[ctx].q = t.value;
    clearTimeout(sqTimer); sqTimer = setTimeout(() => { state.opened.clear(); ctx === 'list' ? drawList() : drawDict(); persistNav(); }, 220);
  }
  else if (t.id === 'mineQ') { state.mine.q = t.value; drawMine(); }
  else if (t.id === 'rubyQ') { state.ruby.q = t.value; drawRuby(); }
  else if (t.id === 'rbWord' || t.id === 'rbRead') {
    const w = document.getElementById('rbWord').value.trim(), r = document.getElementById('rbRead').value.trim();
    document.getElementById('rbPv').innerHTML = w ? (r ? `<ruby>${esc(w)}<rt>${esc(r)}</rt></ruby>` : esc(w)) : '<span class="muted">ここに見え方が出ます</span>';
  }
  else if (t.id === 'bulkText') { state.bulk.text = t.value; onBulkInput(); }
  else if (t.id === 'bulkNew') state.bulk.newName = t.value;
  else if (t.id === 'impNew') state.imp.newName = t.value;
  else if (t.id === 'newUnit') { const b = document.getElementById('unitCreateBtn'); if (b) b.disabled = !t.value.trim(); }
  else if (t.id === 'oneNew') state.one.newName = t.value;
  else if (t.closest('#oneForm') && t.dataset.f && t.dataset.f !== 'unit') state.one.f[t.dataset.f] = t.value;
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (cur().v === 'setup' && ['sDir', 'sPreset', 'sCat', 'sCount', 'sSets', 'sSize'].includes(t.id)) {
    const S = state.setup, kind = cur().a, unit = cur().u, v = t.value;
    if (t.id === 'sDir') S.dir = v;
    if (t.id === 'sPreset') { S.custom[kind] = v === 'custom'; if (v !== 'custom') S.buckets[kind] = new Set(PRESETS.find(p => p[0] === v)[2]); }
    if (t.id === 'sCat') { const cs = catsFor(kind, unit); state.setup.cats[`${unit}|${kind}`] = new Set(v ? [v] : cs); }
    if (t.id === 'sCount') S.count = v === 'all' ? 'all' : +v;
    if (t.id === 'sSets') S.sets = +v;
    if (t.id === 'sSize') S.size = +v;
    render(cur(), true); return;
  }
  if (t.id === 'lkind') { state.list.kind = t.value; state.opened.clear(); render(cur(), true); return; }
  if (t.id === 'dtab') { state.dict.tab = t.value; state.search.dict.cat = ''; render(cur(), true); return; }
  if (t.id === 'fUnit' && document.getElementById('fCat')) {
    const yr = state.dict.tab === 'years', sel = document.getElementById('fCat');
    sel.innerHTML = `<option value="">${yr ? 'すべての時代' : 'すべての分野'}</option>` + openFilterSheet.catList(t.value).map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    return;
  }
  if (t.id === 'impUnit') { state.imp.unit = t.value; state.imp.items.forEach(x => { if (!x.unitPreset && !x.unitName) x.sel = !impDup(x); }); render(cur(), true); }
  else if (t.dataset && t.dataset.imp != null) { const it = state.imp.items[+t.dataset.imp]; it.sel = t.checked; render(cur(), true); }
  else if (t.id === 'oneUnit') { state.one.unit = t.value; render(cur(), true); }
  else if (t.id === 'importFile' && t.files[0]) { importBackup(t.files[0]); t.value = ''; }
  else if (t.id === 'bulkFile' && t.files[0]) {
    const rd = new FileReader();
    rd.onload = () => { state.bulk.text = (state.bulk.text ? state.bulk.text.trim() + '\n---\n' : '') + String(rd.result); state.bulk.done = null; render(cur(), true); toast('読み込みました'); };
    rd.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('keydown', ev => {
  if (document.querySelector('.dlg')) return;
  if (ev.key === 'Escape') { if (tipEl) { hideTip(); return; } if (modalOpen()) { requestCloseModal(); return; } }
  if (ev.key === 'Enter' && (ev.target.id === 'sq-list' || ev.target.id === 'sq-dict') && !ev.isComposing) { ev.preventDefault(); ev.target.blur(); return; }
  if (ev.key === 'Enter' && ev.target.id === 'newUnit' && !ev.isComposing) { ev.preventDefault(); createUnit(); return; }
  const r = state.round;
  if (cur().v !== 'round' || !r || !r.cur || /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName) || modalOpen()) return;
  if (r.cur.type === 'quiz' && r.cur.picked === null && /^[1-4]$/.test(ev.key)) { choose(+ev.key - 1); ev.preventDefault(); }
  else if (r.cur.type === 'quiz' && r.cur.picked === null && (ev.key === '0' || ev.key === '?')) { choose(-1); ev.preventDefault(); }
});

clearSession();
buildData();
let scrollSave = null;
addEventListener('scroll', () => { clearTimeout(scrollSave); scrollSave = setTimeout(persistNav, 300); }, { passive: true });
addEventListener('pagehide', persistNav);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persistNav(); });
if (!restoreNav()) { history.replaceState({ d: 0 }, ''); go({ v: 'home' }, 'tab'); }
})();

</script>
